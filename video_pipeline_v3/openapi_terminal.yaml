openapi: 3.0.3
info:
  title: Protocol Pulse Terminal API
  version: 1.0.0
  description: |
    Premium Bitcoin Intelligence — Bloomberg for Bitcoin.

    Real-time topic velocity, entity tracking, sentiment analysis, breaking news detection,
    and network health monitoring across 80+ Bitcoin YouTube channels.

    ## Authentication
    All endpoints require an `X-API-Key` header.

    ## Tiers
    | Tier | Price | Rate Limit | Endpoints |
    |------|-------|-----------|-----------|
    | Free | $0/mo | 10/day | /topics (top 3, 24h delay) |
    | Operator | $19/mo | 100/day | All endpoints, real-time |
    | Commander | $49/mo | 1,000/day | All endpoints, real-time |
    | Sovereign | $99/mo | Unlimited | All endpoints, priority |

  contact:
    name: Protocol Pulse
    url: https://protocolpulse.io
    email: team@protocolpulse.io

servers:
  - url: https://protocolpulse.replit.app
    description: Production
  - url: http://localhost:5000
    description: Development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Your Pulse Terminal API key

  schemas:
    Meta:
      type: object
      properties:
        tier:
          type: string
          enum: [free, operator, commander, sovereign]
        freshness:
          type: string
          format: date-time
          example: "2026-03-05T15:45:00Z"
        rate_limit_remaining:
          oneOf:
            - type: integer
            - type: string
          example: 987
        rate_limit_reset:
          type: string
          format: date-time

    Topic:
      type: object
      properties:
        topic:
          type: string
          example: "mining difficulty"
        velocity_score:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        channels:
          type: integer
          example: 7
        sentiment:
          type: string
          enum: [bullish, bearish, neutral]
          example: "bearish"

    Entity:
      type: object
      properties:
        name:
          type: string
          example: "Michael Saylor"
        type:
          type: string
          enum: [person, company, regulator, protocol]
        mentions_24h:
          type: integer
          example: 14
        channels_covering:
          type: integer
          example: 8
        channel_names:
          type: array
          items:
            type: string

    SentimentOverall:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
          example: 72
        label:
          type: string
          enum: [very_bullish, bullish, neutral, bearish, very_bearish]
        change_24h:
          type: string
          example: "+7"

    BreakingAlert:
      type: object
      nullable: true
      properties:
        topic:
          type: string
        velocity_score:
          type: integer
        channels:
          type: integer
        detected_at:
          type: string
          format: date-time
        severity:
          type: string
          enum: [medium, high]
        summary:
          type: string

    Error401:
      type: object
      properties:
        error:
          type: string
          example: "Missing X-API-Key header. Get your key at protocolpulse.io/terminal"

    Error429:
      type: object
      properties:
        error:
          type: string
          example: "Rate limit exceeded. free tier allows 10 requests/day."
        tier:
          type: string
        retry_after:
          type: string
          format: date-time

paths:
  /api/v2/terminal/topics:
    get:
      summary: Topic Velocity
      description: |
        What Bitcoin YouTube is talking about right now. Returns topic velocity scores
        based on real-time monitoring of 80+ channels.

        **Free tier**: Top 3 topics only, 24-hour data delay.
      tags: [Intelligence]
      parameters:
        - name: min_velocity
          in: query
          schema:
            type: integer
          description: Filter topics with velocity score >= this value
        - name: topic
          in: query
          schema:
            type: string
          description: Filter by topic name (case-insensitive substring match)
      responses:
        "200":
          description: Topic velocity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      topics:
                        type: array
                        items:
                          $ref: "#/components/schemas/Topic"
                      scan_time:
                        type: string
                        format: date-time
                      total_channels_monitored:
                        type: integer
                        example: 80
                      total_videos_analyzed_24h:
                        type: integer
                        example: 42
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error401"
        "429":
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until rate limit resets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error429"

  /api/v2/terminal/entities:
    get:
      summary: Entity Tracking
      description: |
        Who's being talked about across Bitcoin YouTube and how sentiment is shifting.
        Tracks 50+ entities (people, companies, regulators, protocols).
      tags: [Intelligence]
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [person, company, regulator, protocol]
          description: Filter by entity type
        - name: min_mentions
          in: query
          schema:
            type: integer
          description: Filter entities with >= N mentions
        - name: sort
          in: query
          schema:
            type: string
            enum: [mentions, channels]
          description: Sort order (default mentions)
      responses:
        "200":
          description: Entity mention data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      entities:
                        type: array
                        items:
                          $ref: "#/components/schemas/Entity"
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Authentication failed
        "403":
          description: Endpoint not available on your tier
        "429":
          description: Rate limit exceeded

  /api/v2/terminal/sentiment:
    get:
      summary: Market Sentiment Index
      description: |
        The Protocol Pulse Sentiment Index — composite score derived from
        YouTube topic velocity, entity sentiment, and narrative analysis.
        Includes institutional, retail, and mining breakdowns.
      tags: [Intelligence]
      responses:
        "200":
          description: Sentiment data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      overall:
                        $ref: "#/components/schemas/SentimentOverall"
                      breakdown:
                        type: object
                        properties:
                          institutional:
                            type: object
                          retail:
                            type: object
                          mining:
                            type: object
                      historical:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                              format: date
                            score:
                              type: integer
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Authentication failed
        "429":
          description: Rate limit exceeded

  /api/v2/terminal/breaking:
    get:
      summary: Breaking News Detection
      description: |
        Real-time alerts when narrative convergence is detected — 4+ channels
        covering the same topic within a 3-hour window.
      tags: [Alerts]
      responses:
        "200":
          description: Breaking news status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      breaking:
                        type: boolean
                      alert:
                        $ref: "#/components/schemas/BreakingAlert"
                      monitoring:
                        type: boolean
                      threshold:
                        type: object
                        properties:
                          channels:
                            type: integer
                            example: 4
                          window_hours:
                            type: integer
                            example: 3
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Authentication failed
        "429":
          description: Rate limit exceeded

  /api/v2/terminal/network:
    get:
      summary: Bitcoin Network Health
      description: |
        Node count from Bitnodes, block height, and halving countdown.
        Updated every 15 minutes.
      tags: [Network]
      responses:
        "200":
          description: Network health data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      nodes:
                        type: object
                        properties:
                          total_reachable:
                            type: integer
                            example: 102847
                          net_change_24h:
                            type: integer
                            example: 127
                      halving:
                        type: object
                        properties:
                          blocks_remaining:
                            type: integer
                          estimated_date:
                            type: string
                            format: date
                          next_halving_block:
                            type: integer
                            example: 1050000
                      latest_block_height:
                        type: integer
                  meta:
                    $ref: "#/components/schemas/Meta"
        "401":
          description: Authentication failed
        "429":
          description: Rate limit exceeded
