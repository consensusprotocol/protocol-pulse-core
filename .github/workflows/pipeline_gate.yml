name: Pipeline Integrity Gate

on:
  push:
    branches: [main, render-stable]
  pull_request:
    branches: [main]

jobs:
  enforce_pipeline_integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for audit log (pipeline files changed)
        run: |
          # Get list of changed pipeline files
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -E "video_pipeline_v3/.*\.py|smart_render_loop|assembler|dual_gpu_orchestrator" || true)
          if [ -n "$CHANGED" ]; then
            echo "Pipeline files changed: $CHANGED"

            # Check commit message for HOTFIX-EXEMPT
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -q "HOTFIX-EXEMPT"; then
              echo "✅ HOTFIX-EXEMPT found in commit message — skipping audit check"
              exit 0
            fi

            # Check if audit log exists and is recent
            AUDIT_LOGS=$(find docs/audits/ -type f \( -name "*.md" -o -name "*.log" \) 2>/dev/null | head -5)
            if [ -z "$AUDIT_LOGS" ]; then
              echo "❌ BLOCKED: Pipeline code changed without audit log in docs/audits/"
              echo "Run: python3 utils/cross_llm_audit.py --feature video-audio-fix"
              exit 1
            fi
            echo "✅ Audit log found: $AUDIT_LOGS"
          else
            echo "✅ No pipeline files changed"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests 2>/dev/null || true

      - name: Syntax check all pipeline Python files
        run: |
          ERRORS=0
          for f in $(find video_pipeline_v3/ -name "*.py" 2>/dev/null); do
            if ! python3 -m py_compile "$f" 2>/dev/null; then
              echo "❌ Syntax error: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done
          for f in smart_render_loop.py dual_gpu_orchestrator.py; do
            if [ -f "$f" ]; then
              if ! python3 -m py_compile "$f" 2>/dev/null; then
                echo "❌ Syntax error: $f"
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done
          if [ "$ERRORS" -eq 0 ]; then
            echo "✅ All syntax OK"
          else
            echo "❌ $ERRORS syntax errors found"
            exit 1
          fi

      - name: Check best_grade.json not regressed
        run: |
          if [ -f logs/best_grade.json ]; then
            python3 -c "
          import json
          d = json.load(open('logs/best_grade.json'))
          score = d.get('score', 0)
          promoted = d.get('promoted_at', 'never')
          print(f'Current best grade: {score}/100 promoted at {promoted}')
          "
          else
            echo "No best_grade.json found — first run"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d "text=❌ GitHub Actions BLOCKED push to Protocol Pulse pipeline. Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
