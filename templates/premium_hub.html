{% extends "base.html" %}
{% block title %}Commander Hub — Protocol Pulse{% endblock %}
{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--s1:#080808;--s2:#101010;--s3:#181818;
  --border:#1a1a1a;--border2:#262626;
  --red:#CC0000;--red-dim:rgba(204,0,0,0.12);--red-glow:rgba(204,0,0,0.25);
  --gold:#F8C15C;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;
  --muted:#555;--text:#e8e8e8;--dim:rgba(255,255,255,0.42);
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);}

.hub2-wrap{max-width:1560px;margin:0 auto;padding:64px 16px 48px;}

/* ══════════ TOP BAR ══════════ */
.hub2-topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 14px 18px;margin-bottom:20px;
  background:linear-gradient(180deg,var(--s1) 0%,rgba(8,8,8,0.4) 100%);
  border:1px solid var(--border);border-left:3px solid var(--red);
  position:sticky;top:56px;z-index:100;backdrop-filter:blur(8px);
}
.hub2-brand{display:flex;align-items:center;gap:12px;}
.hub2-brand-logo{
  width:26px;height:26px;border:1px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;color:var(--red);
}
.hub2-brand-name{font-size:10px;font-weight:900;letter-spacing:.35em;color:var(--red);text-transform:uppercase;}
.hub2-brand-sub{font-size:7px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-top:2px;}
.hub2-tier-chip{
  font-size:7px;letter-spacing:.25em;padding:3px 9px;
  border:1px solid var(--gold);color:var(--gold);border-radius:1px;
  text-transform:uppercase;font-weight:700;
}
.hub2-center{display:flex;align-items:center;gap:18px;}
.hub2-clock-block{display:flex;flex-direction:column;gap:2px;text-align:center;}
.hub2-clock-label{font-size:6px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;}
.hub2-clock-val{font-size:14px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.05em;}
.hub2-pcaf-ring{
  width:52px;height:52px;position:relative;
}
.hub2-pcaf-ring svg{transform:rotate(-90deg);}
.hub2-pcaf-ring .pcaf-track{stroke:var(--border);stroke-width:3;fill:none;}
.hub2-pcaf-ring .pcaf-fill{stroke:var(--gold);stroke-width:3;fill:none;stroke-linecap:round;transition:stroke-dashoffset 1s ease;}
.hub2-pcaf-val{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:900;color:var(--gold);
}
.hub2-right{display:flex;align-items:center;gap:8px;}
.hub2-btn{
  font-family:var(--mono);font-size:8px;font-weight:700;letter-spacing:.2em;
  padding:8px 14px;background:transparent;border:1px solid var(--border2);
  color:var(--dim);text-transform:uppercase;cursor:pointer;
  transition:all .15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
}
.hub2-btn:hover{border-color:var(--red);color:var(--red);}
.hub2-btn.on{border-color:var(--red);color:var(--red);background:var(--red-dim);}
.hub2-btn.primary{border-color:var(--gold);color:var(--gold);}
.hub2-btn.primary:hover{background:var(--gold);color:#000;}
.hub2-bell{
  position:relative;width:32px;height:32px;border:1px solid var(--border2);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--dim);cursor:pointer;transition:all .15s;font-size:12px;
}
.hub2-bell:hover{border-color:var(--red);color:var(--red);}
.hub2-bell-badge{
  position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;padding:0 3px;
  background:var(--red);color:#fff;font-size:8px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border-radius:7px;
}

/* ══════════ WIDGET GRID ══════════ */
.hub2-grid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;align-items:stretch;
}
@media(max-width:1100px){.hub2-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:600px){.hub2-grid{grid-template-columns:1fr;}}

.widget{
  background:var(--s1);border:1px solid var(--border);
  border-top:2px solid var(--red);
  min-height:220px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(8px);
  animation:widgetIn .35s ease forwards;
}
@keyframes widgetIn{to{opacity:1;transform:none;}}
.widget[data-accent="gold"]{border-top-color:var(--gold);}
.widget[data-accent="green"]{border-top-color:var(--green);}
.widget[data-accent="blue"]{border-top-color:var(--blue);}
.widget[data-accent="purple"]{border-top-color:var(--purple);}
.widget[data-accent="orange"]{border-top-color:var(--orange);}
.widget.w-2{grid-column:span 2;}
.widget.h-2{grid-row:span 2;}
@media(max-width:600px){.widget.w-2{grid-column:span 1;}}

.widget-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px 10px;border-bottom:1px solid var(--border);
}
.widget-title{
  font-size:8px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
  color:var(--dim);display:flex;align-items:center;gap:7px;
}
.widget-title .dot{
  width:5px;height:5px;border-radius:50%;background:var(--red);
  box-shadow:0 0 6px var(--red);animation:widgetPulse 2s ease-in-out infinite;
}
@keyframes widgetPulse{0%,100%{opacity:1}50%{opacity:.35}}
.widget[data-accent="gold"] .widget-title .dot{background:var(--gold);box-shadow:0 0 6px var(--gold);}
.widget[data-accent="green"] .widget-title .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
.widget[data-accent="blue"] .widget-title .dot{background:var(--blue);box-shadow:0 0 6px var(--blue);}
.widget[data-accent="purple"] .widget-title .dot{background:var(--purple);box-shadow:0 0 6px var(--purple);}
.widget[data-accent="orange"] .widget-title .dot{background:var(--orange);box-shadow:0 0 6px var(--orange);}

.widget-badge{font-size:6px;letter-spacing:.2em;padding:2px 7px;border-radius:1px;text-transform:uppercase;}
.widget-badge.live{background:var(--red-dim);color:var(--red);border:1px solid rgba(204,0,0,.35);}
.widget-badge.bullish{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.35);}
.widget-badge.bearish{background:var(--red-dim);color:var(--red);border:1px solid rgba(204,0,0,.35);}
.widget-badge.neutral{background:rgba(248,193,92,.1);color:var(--gold);border:1px solid rgba(248,193,92,.35);}
.widget-badge.cautious{background:rgba(248,193,92,.12);color:var(--gold);border:1px solid rgba(248,193,92,.35);}

.widget-body{padding:14px;flex:1;overflow:hidden;display:flex;flex-direction:column;}
.widget.collapsed .widget-body{display:none;}

.widget-edit-bar{
  position:absolute;top:0;right:0;display:none;
  padding:4px 6px;gap:4px;z-index:5;
}
.widget-edit-btn{
  width:22px;height:22px;background:rgba(0,0,0,0.85);border:1px solid var(--border2);
  color:var(--dim);cursor:pointer;font-size:10px;
  display:inline-flex;align-items:center;justify-content:center;transition:all .15s;
}
.widget-edit-btn:hover{border-color:var(--red);color:var(--red);}

body.hub2-edit .widget-edit-bar{display:flex;}
body.hub2-edit .widget{
  cursor:grab;
  outline:1px dashed rgba(204,0,0,0.35);outline-offset:-3px;
}
body.hub2-edit .widget.dragging{
  cursor:grabbing;transform:scale(1.02);
  box-shadow:0 12px 40px rgba(204,0,0,0.35);opacity:.85;
  outline-color:var(--red);z-index:50;
}
body.hub2-edit .widget.drop-target{
  outline:2px dashed var(--red);background:var(--red-dim);
}
body.hub2-edit .widget.disabled{opacity:.45;}

/* ══════════ WIDGET CONTENT STYLES ══════════ */
.w-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.w-row:last-child{border-bottom:none;}
.w-row-label{font-size:8px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase;}
.w-row-val{font-size:11px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums;}
.w-row-val.red{color:var(--red);}
.w-row-val.gold{color:var(--gold);}
.w-row-val.green{color:var(--green);}
.w-row-val.blue{color:var(--blue);}

.w-stat{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:var(--s2);border:1px solid var(--border);}
.w-stat-label{font-size:6px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;}
.w-stat-val{font-size:15px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.1;}
.w-stat-val.gold{color:var(--gold);}.w-stat-val.red{color:var(--red);}.w-stat-val.green{color:var(--green);}

.w-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}

.w-gauge{position:relative;height:78px;display:flex;align-items:center;justify-content:center;margin:6px 0 10px;}
.w-gauge svg{width:120px;height:68px;}
.w-gauge-label{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:6px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;}
.w-gauge-val{font-size:22px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;}

.w-bar{height:4px;background:var(--border);margin-top:5px;overflow:hidden;}
.w-bar-fill{height:100%;transition:width .8s ease;}

.w-sig-pill{font-size:6px;letter-spacing:.2em;padding:2px 6px;border-radius:1px;font-weight:700;}
.w-sig-pill.BULLISH{background:rgba(34,197,94,.12);color:var(--green);border:1px solid rgba(34,197,94,.4);}
.w-sig-pill.CAUTIOUS{background:rgba(248,193,92,.12);color:var(--gold);border:1px solid rgba(248,193,92,.4);}
.w-sig-pill.BEARISH{background:var(--red-dim);color:var(--red);border:1px solid rgba(204,0,0,.4);}
.w-sig-pill.NEUTRAL{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--border2);}

/* Intel brief */
.brief-verdict{display:inline-flex;align-items:center;gap:6px;font-size:8px;letter-spacing:.18em;padding:4px 10px;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.brief-verdict.bullish{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.35);}
.brief-verdict.bearish{background:var(--red-dim);color:var(--red);border:1px solid rgba(204,0,0,.35);}
.brief-verdict.neutral{background:rgba(248,193,92,.1);color:var(--gold);border:1px solid rgba(248,193,92,.35);}
.brief-reason{font-size:10px;line-height:1.65;color:var(--text);margin-bottom:10px;}
.brief-section-label{font-size:7px;letter-spacing:.22em;color:var(--muted);margin-top:8px;margin-bottom:5px;text-transform:uppercase;}
.brief-narrative{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.03);font-size:9.5px;line-height:1.55;color:var(--dim);}
.brief-narrative::before{content:'▸';color:var(--red);flex-shrink:0;}
.brief-tags{display:flex;flex-wrap:wrap;gap:4px;}
.brief-tag{font-size:8px;padding:2px 7px;background:var(--s2);border:1px solid var(--border);color:var(--dim);}

/* Convergence radar */
.w-radar{width:100%;aspect-ratio:1.8/1;max-height:220px;}
.w-radar-legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:8px;color:var(--dim);margin-top:6px;}
.w-radar-legend-row{display:flex;justify-content:space-between;padding:2px 0;}

/* Alert item */
.alert-item{padding:8px 10px;border-left:2px solid var(--red);background:var(--s2);margin-bottom:6px;}
.alert-item.WATCH{border-left-color:var(--gold);}
.alert-item.ACTION{border-left-color:var(--red);}
.alert-title{font-size:9.5px;font-weight:700;color:var(--text);margin-bottom:3px;}
.alert-desc{font-size:9px;color:var(--dim);line-height:1.5;}
.alert-meta{font-size:7px;color:var(--muted);margin-top:4px;letter-spacing:.1em;}

/* Whale alert */
.flow-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.flow-item:last-child{border-bottom:none;}
.flow-icon{font-size:13px;flex-shrink:0;}
.flow-body{flex:1;font-size:9.5px;color:var(--text);line-height:1.5;}
.flow-body b{color:var(--gold);font-weight:900;}
.flow-time{font-size:7px;color:var(--muted);letter-spacing:.1em;}

/* Command lanes */
.lanes-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
@media(max-width:900px){.lanes-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.lanes-grid{grid-template-columns:repeat(2,1fr);}}
.lane{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 10px;background:var(--s2);border:1px solid var(--border);color:var(--dim);
  text-decoration:none;font-size:8.5px;letter-spacing:.15em;transition:all .15s;
  text-transform:uppercase;font-weight:700;
}
.lane:hover{border-color:var(--red);color:var(--red);background:var(--red-dim);transform:translateY(-2px);}
.lane i{font-size:14px;color:var(--red);}

/* KOL */
.kol-banner{padding:8px 10px;margin-bottom:8px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.kol-banner.bullish{background:rgba(34,197,94,.08);border-left:2px solid var(--green);color:var(--green);}
.kol-banner.bearish{background:var(--red-dim);border-left:2px solid var(--red);color:var(--red);}
.kol-banner.neutral{background:rgba(248,193,92,.08);border-left:2px solid var(--gold);color:var(--gold);}
.kol-section{font-size:9.5px;color:var(--text);line-height:1.55;margin-bottom:7px;}
.kol-signal-box{padding:6px 10px;background:var(--s2);border-left:2px solid var(--gold);color:var(--gold);font-size:9px;line-height:1.5;margin-bottom:5px;}
.kol-signal-box.contra{border-left-color:var(--red);color:var(--red);}
.kol-voices{font-size:7px;color:var(--muted);margin-top:6px;letter-spacing:.1em;}

/* Empty state */
.w-empty{display:flex;align-items:center;justify-content:center;flex:1;font-size:9px;color:var(--muted);letter-spacing:.15em;padding:20px;text-align:center;}

/* ══════════ NOTIFICATION DRAWER ══════════ */
.notif-drawer{
  position:fixed;top:56px;right:0;bottom:0;width:360px;max-width:90vw;
  background:var(--s1);border-left:1px solid var(--border);
  transform:translateX(100%);transition:transform .25s ease;
  z-index:200;overflow-y:auto;padding:18px 16px;
}
.notif-drawer.open{transform:translateX(0);}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.notif-head h3{font-size:9px;letter-spacing:.25em;color:var(--red);font-weight:700;text-transform:uppercase;}
.notif-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;}
.notif-empty{padding:32px 12px;text-align:center;font-size:9px;color:var(--muted);letter-spacing:.15em;}

/* ══════════ TOAST ══════════ */
.hub2-toast{
  position:fixed;bottom:20px;right:20px;background:var(--s2);
  border:1px solid var(--green);border-left:3px solid var(--green);
  padding:10px 16px;font-size:9px;color:var(--text);z-index:9999;
  letter-spacing:.1em;animation:toastIn .2s ease;
}
@keyframes toastIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ══════════ CATALOG (add-widget panel) ══════════ */
.catalog{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  background:var(--s1);border:1px solid var(--red);padding:18px;z-index:300;
  width:620px;max-width:94vw;max-height:78vh;overflow-y:auto;display:none;
}
.catalog.open{display:block;}
.catalog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.catalog-head h3{font-size:10px;letter-spacing:.3em;color:var(--red);font-weight:900;text-transform:uppercase;}
.catalog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.catalog-item{padding:10px 12px;border:1px solid var(--border);background:var(--s2);display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .15s;}
.catalog-item:hover{border-color:var(--red);background:var(--red-dim);}
.catalog-item-name{font-size:10px;font-weight:700;color:var(--text);letter-spacing:.1em;}
.catalog-item-desc{font-size:8px;color:var(--muted);line-height:1.5;}
.catalog-item.on{border-color:var(--green);}
.catalog-item.on .catalog-item-name::after{content:' ✓';color:var(--green);}
.catalog-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:250;display:none;}
.catalog-backdrop.open{display:block;}

</style>
{% endblock %}

{% block content %}
<div class="hub2-wrap">

  <!-- ═══════ TOP BAR ═══════ -->
  <div class="hub2-topbar">
    <div class="hub2-brand">
      <div class="hub2-brand-logo">⬡</div>
      <div>
        <div class="hub2-brand-name">COMMANDER HUB</div>
        <div class="hub2-brand-sub">intelligence workspace · v2</div>
      </div>
      <span class="hub2-tier-chip">{{ tier|upper }}</span>
    </div>
    <div class="hub2-center">
      <div class="hub2-clock-block">
        <span class="hub2-clock-label">UTC</span>
        <span class="hub2-clock-val" id="hub2-clock">—</span>
      </div>
      <div class="hub2-pcaf-ring" title="Pulse Convergence &amp; Action Factor">
        <svg viewBox="0 0 52 52"><circle class="pcaf-track" cx="26" cy="26" r="22"/><circle id="hub2-pcaf-fill" class="pcaf-fill" cx="26" cy="26" r="22" stroke-dasharray="138" stroke-dashoffset="138"/></svg>
        <div class="hub2-pcaf-val" id="hub2-pcaf">—</div>
      </div>
    </div>
    <div class="hub2-right">
      <button class="hub2-bell" id="hub2-bell" title="Alerts">
        🔔<span class="hub2-bell-badge" id="hub2-bell-badge" style="display:none;">0</span>
      </button>
      <button class="hub2-btn" id="hub2-add-btn" title="Add widgets">＋ WIDGETS</button>
      <button class="hub2-btn" id="hub2-edit-btn">✎ EDIT LAYOUT</button>
      <button class="hub2-btn" id="hub2-reset-btn" title="Restore defaults">⟲ RESET</button>
      <a href="/terminal" class="hub2-btn primary">⚡ TERMINAL</a>
    </div>
  </div>

  <!-- ═══════ WIDGET GRID ═══════ -->
  <div class="hub2-grid" id="hub2-grid"></div>

</div><!-- /.hub2-wrap -->

<!-- ═══════ NOTIFICATION DRAWER ═══════ -->
<div class="notif-drawer" id="notif-drawer">
  <div class="notif-head">
    <h3>⚠ ACTIVE ALERTS</h3>
    <button class="notif-close" id="notif-close">✕</button>
  </div>
  <div id="notif-body">
    <div class="notif-empty">No active alerts</div>
  </div>
</div>

<!-- ═══════ WIDGET CATALOG ═══════ -->
<div class="catalog-backdrop" id="catalog-backdrop"></div>
<div class="catalog" id="catalog">
  <div class="catalog-head">
    <h3>Widget Catalog</h3>
    <button class="notif-close" id="catalog-close">✕</button>
  </div>
  <div class="catalog-grid" id="catalog-grid"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// COMMANDER HUB v2 — Client
// ══════════════════════════════════════════════════════════════════════
(function(){
  'use strict';

  const USER_IS_ADMIN = {{ 'true' if current_user.is_admin else 'false' }};

  // ── Widget catalog (id → {title, desc, accent, render}) ────────────
  const WIDGETS = {
    intel_brief: {title:'Intel Brief', desc:'Morning intelligence: sentiment, narratives, trending language',   accent:'red',    render: renderIntelBrief},
    pro_metrics: {title:'Pro Metrics', desc:'SSR, MPI, Dormancy Flow, NVT ratio — on-chain pro signals',         accent:'gold',   render: renderProMetrics},
    options:     {title:'Options Desk',desc:'Put/call ratio, DVOL, max pain, OI distribution',                   accent:'purple', render: renderOptions},
    futures:     {title:'Futures',     desc:'Funding rate, basis, open interest, mark/index spread',             accent:'orange', render: renderFutures},
    convergence: {title:'Convergence', desc:'5-axis radar: miner, exchange, social, insider, convergence score', accent:'red',    render: renderConvergence},
    macro:       {title:'Macro Corr',  desc:'DXY, Gold, S&P, BTC correlations, 10Y yield',                       accent:'blue',   render: renderMacro},
    alerts:      {title:'Alerts',      desc:'Live pattern matches and active intelligence alerts',               accent:'red',    render: renderAlerts},
    kol:         {title:'KOL Signal',  desc:'Dominant narrative, top signal, contrarian view',                   accent:'gold',   render: renderKOL},
    on_chain:    {title:'On-Chain',    desc:'Dormancy, active addresses, TX volume, accumulation score',         accent:'green',  render: renderOnChain},
    polymarket:  {title:'Polymarket',  desc:'Prediction market sentiment and top market',                        accent:'purple', render: renderPolymarket},
    exchange_flow:{title:'Exchange Flow',desc:'Exchange pressure signal + whale alert feed',                     accent:'blue',   render: renderExchangeFlow},
    command_lanes:{title:'Command Lanes',desc:'Quick nav to PP tools (pinned, cannot be removed)',               accent:'gold',   render: renderLanes},
  };

  let LAYOUT = [];
  let INTEL  = {};
  let EDIT_MODE = false;
  let DRAG = null;

  // ── Fetch layout + intel in parallel ───────────────────────────────
  Promise.all([
    fetch('/api/hub/layout', {credentials:'same-origin'}).then(r=>r.json()).catch(e=>({widgets:[]})),
    fetch('/api/hub/intel',  {credentials:'same-origin'}).then(r=>r.json()).catch(e=>({})),
  ]).then(([layoutResp, intelResp])=>{
    LAYOUT = (layoutResp.widgets || []).sort(sortGrid);
    INTEL  = intelResp || {};
    renderGrid();
    renderPCAF(INTEL.pcaf_score);
    renderNotifications(INTEL.alerts || []);
  });

  function sortGrid(a,b){
    if (a.position_y !== b.position_y) return a.position_y - b.position_y;
    return a.position_x - b.position_x;
  }

  // ── Render the grid ────────────────────────────────────────────────
  function renderGrid(){
    const grid = document.getElementById('hub2-grid');
    grid.innerHTML = '';
    LAYOUT.filter(w => w.enabled).forEach((w, idx) => {
      const def = WIDGETS[w.widget_id];
      if (!def) return;
      const el = document.createElement('div');
      el.className = 'widget' + (w.width >= 2 ? ' w-2':'') + (w.height >= 2 ? ' h-2':'') + (w.collapsed?' collapsed':'');
      el.dataset.widgetId = w.widget_id;
      el.dataset.accent = def.accent;
      el.style.animationDelay = (idx * 50) + 'ms';
      el.draggable = false;

      el.innerHTML = `
        <div class="widget-edit-bar">
          <button class="widget-edit-btn" data-act="resize" title="Resize">${w.width >= 2 ? '◧' : '◨'}</button>
          <button class="widget-edit-btn" data-act="collapse" title="Collapse">${w.collapsed?'▾':'▴'}</button>
          <button class="widget-edit-btn" data-act="remove" title="Hide">✕</button>
        </div>
        <div class="widget-head">
          <div class="widget-title"><span class="dot"></span>${def.title}</div>
          <div class="widget-badge-slot"></div>
        </div>
        <div class="widget-body"></div>
      `;

      const body = el.querySelector('.widget-body');
      const badgeSlot = el.querySelector('.widget-badge-slot');
      try {
        def.render(body, INTEL[w.widget_id] || INTEL, badgeSlot);
      } catch(e) {
        console.error('render error', w.widget_id, e);
        body.innerHTML = '<div class="w-empty">Data unavailable</div>';
      }

      el.querySelectorAll('.widget-edit-btn').forEach(btn => {
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          handleWidgetAction(w.widget_id, btn.dataset.act);
        });
      });

      // Drag events
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragover',  onDragOver);
      el.addEventListener('dragleave', onDragLeave);
      el.addEventListener('drop',      onDrop);
      el.addEventListener('dragend',   onDragEnd);

      grid.appendChild(el);
    });
  }

  function handleWidgetAction(wid, act){
    const w = LAYOUT.find(x => x.widget_id === wid);
    if (!w) return;
    if (act === 'resize'){
      w.width = w.width >= 2 ? 1 : 2;
    } else if (act === 'collapse'){
      w.collapsed = !w.collapsed;
    } else if (act === 'remove'){
      if (wid === 'command_lanes'){ toast('Command Lanes cannot be hidden'); return; }
      w.enabled = false;
      toggleWidget(wid, false);
    }
    saveLayout();
    renderGrid();
    applyEditMode();
  }

  // ── Drag & drop ─────────────────────────────────────────────────────
  function onDragStart(e){
    if (!EDIT_MODE) { e.preventDefault(); return; }
    DRAG = this.dataset.widgetId;
    this.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', DRAG); } catch(_){}
  }
  function onDragOver(e){
    if (!EDIT_MODE || !DRAG) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (this.dataset.widgetId !== DRAG) this.classList.add('drop-target');
  }
  function onDragLeave(){ this.classList.remove('drop-target'); }
  function onDrop(e){
    e.preventDefault();
    this.classList.remove('drop-target');
    const target = this.dataset.widgetId;
    if (!DRAG || !target || target === DRAG) return;
    swapPositions(DRAG, target);
    saveLayout();
    renderGrid();
    applyEditMode();
  }
  function onDragEnd(){
    document.querySelectorAll('.widget').forEach(el => el.classList.remove('dragging','drop-target'));
    DRAG = null;
  }
  function swapPositions(aId, bId){
    const a = LAYOUT.find(x => x.widget_id === aId);
    const b = LAYOUT.find(x => x.widget_id === bId);
    if (!a || !b) return;
    const tx = a.position_x, ty = a.position_y;
    a.position_x = b.position_x; a.position_y = b.position_y;
    b.position_x = tx;           b.position_y = ty;
  }

  // ── Save + toggle + reset ──────────────────────────────────────────
  function saveLayout(){
    fetch('/api/hub/layout', {
      method:'PATCH', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({widgets: LAYOUT})
    }).catch(()=>{});
  }
  function toggleWidget(widget_id, enabled){
    fetch('/api/hub/widget-toggle', {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({widget_id, enabled})
    }).catch(()=>{});
  }
  function resetLayout(){
    if (!confirm('Reset hub to default layout?')) return;
    fetch('/api/hub/layout/reset', {method:'POST', credentials:'same-origin'})
      .then(()=>location.reload());
  }

  // ── Edit mode toggle ───────────────────────────────────────────────
  function applyEditMode(){
    document.body.classList.toggle('hub2-edit', EDIT_MODE);
    document.getElementById('hub2-edit-btn').classList.toggle('on', EDIT_MODE);
    document.querySelectorAll('.widget').forEach(el => { el.draggable = EDIT_MODE; });
  }

  document.getElementById('hub2-edit-btn').addEventListener('click', () => {
    EDIT_MODE = !EDIT_MODE;
    applyEditMode();
    if (!EDIT_MODE) toast('Layout saved');
  });
  document.getElementById('hub2-reset-btn').addEventListener('click', resetLayout);

  // ── Add-widget catalog ─────────────────────────────────────────────
  document.getElementById('hub2-add-btn').addEventListener('click', openCatalog);
  document.getElementById('catalog-close').addEventListener('click', closeCatalog);
  document.getElementById('catalog-backdrop').addEventListener('click', closeCatalog);
  function openCatalog(){
    const grid = document.getElementById('catalog-grid');
    grid.innerHTML = '';
    Object.entries(WIDGETS).forEach(([id, def]) => {
      const w = LAYOUT.find(x => x.widget_id === id);
      const on = w && w.enabled;
      const el = document.createElement('div');
      el.className = 'catalog-item' + (on?' on':'');
      el.innerHTML = `<div class="catalog-item-name">${def.title}</div><div class="catalog-item-desc">${def.desc}</div>`;
      el.addEventListener('click', () => {
        if (id === 'command_lanes' && on) return;
        const nextEnabled = !on;
        if (w) w.enabled = nextEnabled;
        else LAYOUT.push({widget_id:id, enabled:true, position_x:0, position_y:99, width:1, height:1, collapsed:false, settings:{}});
        toggleWidget(id, nextEnabled);
        saveLayout();
        renderGrid();
        applyEditMode();
        closeCatalog();
      });
      grid.appendChild(el);
    });
    document.getElementById('catalog').classList.add('open');
    document.getElementById('catalog-backdrop').classList.add('open');
  }
  function closeCatalog(){
    document.getElementById('catalog').classList.remove('open');
    document.getElementById('catalog-backdrop').classList.remove('open');
  }

  // ── Notification drawer ────────────────────────────────────────────
  document.getElementById('hub2-bell').addEventListener('click', () => {
    document.getElementById('notif-drawer').classList.toggle('open');
  });
  document.getElementById('notif-close').addEventListener('click', () => {
    document.getElementById('notif-drawer').classList.remove('open');
  });
  function renderNotifications(alerts){
    const body = document.getElementById('notif-body');
    const badge = document.getElementById('hub2-bell-badge');
    if (!alerts || !alerts.length){
      body.innerHTML = '<div class="notif-empty">No active alerts</div>';
      badge.style.display = 'none';
      return;
    }
    badge.textContent = alerts.length;
    badge.style.display = 'flex';
    body.innerHTML = alerts.map(a => `
      <div class="alert-item ${a.severity||'WATCH'}">
        <div class="alert-title">${escapeHtml(a.title||'Alert')}</div>
        <div class="alert-desc">${escapeHtml(a.description||'')}</div>
        <div class="alert-meta">${escapeHtml(a.pattern_id||'')} · ${escapeHtml((a.ts||'').replace('T',' ').slice(0,16))}</div>
      </div>
    `).join('');
  }

  // ── UTC clock ──────────────────────────────────────────────────────
  function tickClock(){
    const d = new Date();
    const pad = x => String(x).padStart(2,'0');
    document.getElementById('hub2-clock').textContent = pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())+':'+pad(d.getUTCSeconds());
  }
  setInterval(tickClock, 1000); tickClock();

  // ── PCAF ring ──────────────────────────────────────────────────────
  function renderPCAF(score){
    const el = document.getElementById('hub2-pcaf');
    const fill = document.getElementById('hub2-pcaf-fill');
    if (score == null) { el.textContent = '—'; return; }
    const s = Math.max(0, Math.min(100, Number(score)));
    el.textContent = Math.round(s);
    const circ = 2 * Math.PI * 22; // 138.23
    fill.setAttribute('stroke-dasharray', circ.toFixed(2));
    fill.setAttribute('stroke-dashoffset', (circ * (1 - s/100)).toFixed(2));
  }

  // ══════════════════════════════════════════════════════════════════
  // WIDGET RENDERERS
  // ══════════════════════════════════════════════════════════════════
  function fmt(n, dig){
    if (n == null || isNaN(n)) return '—';
    const d = dig == null ? 2 : dig;
    return Number(n).toLocaleString('en-US', {minimumFractionDigits:d, maximumFractionDigits:d});
  }
  function fmtInt(n){
    if (n == null || isNaN(n)) return '—';
    return Math.round(Number(n)).toLocaleString('en-US');
  }
  function fmtBig(n){
    if (n == null || isNaN(n)) return '—';
    const x = Math.abs(n);
    if (x >= 1e12) return (n/1e12).toFixed(2)+'T';
    if (x >= 1e9)  return (n/1e9).toFixed(2)+'B';
    if (x >= 1e6)  return (n/1e6).toFixed(2)+'M';
    if (x >= 1e3)  return (n/1e3).toFixed(1)+'K';
    return fmt(n,0);
  }
  function escapeHtml(s){
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
  }

    const arrow = sent==='bullish'?'▲':sent==='bearish'?'▼':'◆';
    body.innerHTML = `
      <div class="brief-verdict ${sent}">${arrow} ${sent.toUpperCase()}</div>
      <div class="brief-reason">${escapeHtml(d.sentiment_reasoning || 'Intelligence brief loading…')}</div>
      <div class="brief-section-label">Dominant Narratives</div>

      <div class="brief-section-label">Trending Language</div>
      <div class="brief-tags">${(d.trending_language||[]).map(t => `<span class="brief-tag">${escapeHtml(t)}</span>`).join('')||'<span class="brief-tag">—</span>'}</div>
    `;

  function renderOptions(body, data, badge){

                stroke-dasharray="${Math.min(pc||0,2)/2*157} 157"/>
          <text x="60" y="56" text-anchor="middle" font-size="16" font-weight="900" fill="${pcColor==='red'?'#CC0000':pcColor==='green'?'#22c55e':'#F8C15C'}" font-family="JetBrains Mono">${fmt(pc,3)}</text>
        </svg>
        <div class="w-gauge-label">PUT / CALL RATIO</div>
      </div>
      <div class="w-grid-2" style="margin-top:12px;">

  function renderFutures(body, data, badge){

        <div class="w-stat"><span class="w-stat-label">BASIS (ANN.)</span><span class="w-stat-val ${d.annualized_basis>=0?'green':'red'}">${d.annualized_basis != null ? (d.annualized_basis>=0?'+':'') + fmt(d.annualized_basis,2)+'%':'—'}</span></div>

      <div class="w-row"><span class="w-row-label">OI (USD)</span><span class="w-row-val gold">$${fmtBig(d.open_interest_usd)}</span></div>
      <div class="w-row"><span class="w-row-label">MARK</span><span class="w-row-val">$${fmtInt(d.mark_price)}</span></div>

    `;

  function renderConvergence(body, data, badge){
    const d = INTEL.convergence || {};
    const axes = [
      {k:'miner_conviction',  label:'MINER CONVICTION', score:d.miner_conviction?.score},
      {k:'exchange_pressure', label:'EXCHANGE PRESSURE', score:d.exchange_pressure?.score},
      {k:'social_divergence', label:'SOCIAL DIVERGENCE', score:d.social_divergence?.score},
      {k:'insider_heat',      label:'INSIDER HEAT',     score:d.insider_heat?.score},
      {k:'convergence_score', label:'CONVERGENCE',      score:d.score},
    ];
    const pattern = d.pattern || '—';
    const patternClass = pattern === 'BULLISH' ? 'bullish' : pattern === 'BEARISH' ? 'bearish' : 'neutral';
    badge.innerHTML = `<span class="widget-badge ${patternClass}">${pattern}</span>`;

    // Build pentagon radar chart
    const cx = 130, cy = 105, r = 78;
    const pts = axes.map((a, i) => {
      const ang = -Math.PI/2 + (i * 2 * Math.PI / 5);
      const v = Math.max(0, Math.min(100, Number(a.score)||0)) / 100;
      return {
        x: cx + Math.cos(ang) * r * v,
        y: cy + Math.sin(ang) * r * v,
        lx: cx + Math.cos(ang) * (r+15),
        ly: cy + Math.sin(ang) * (r+15),
      };
    });
    const polygon = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const rings = [0.25, 0.5, 0.75, 1.0].map(scale => {
      const ringPts = axes.map((_, i) => {
        const ang = -Math.PI/2 + (i * 2 * Math.PI / 5);
        return `${(cx + Math.cos(ang) * r * scale).toFixed(1)},${(cy + Math.sin(ang) * r * scale).toFixed(1)}`;
      }).join(' ');
      return `<polygon points="${ringPts}" fill="none" stroke="#242424" stroke-width="1"/>`;
    }).join('');

    body.innerHTML = `
      <svg class="w-radar" viewBox="0 0 260 210" preserveAspectRatio="xMidYMid meet">
        ${rings}
        ${axes.map((a, i) => {
          const ang = -Math.PI/2 + (i * 2 * Math.PI / 5);
          return `<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(ang)*r).toFixed(1)}" y2="${(cy+Math.sin(ang)*r).toFixed(1)}" stroke="#242424" stroke-width="1"/>`;
        }).join('')}
        <polygon points="${polygon}" fill="rgba(204,0,0,0.18)" stroke="#CC0000" stroke-width="1.5"/>
        ${pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#F8C15C"/>`).join('')}
        ${axes.map((a,i) => `<text x="${pts[i].lx.toFixed(1)}" y="${pts[i].ly.toFixed(1)}" fill="#888" font-size="7" font-family="JetBrains Mono" text-anchor="middle">${a.label}</text>`).join('')}
      </svg>
      <div class="w-radar-legend">
        ${axes.map(a => `<div class="w-radar-legend-row"><span style="color:var(--muted);">${a.label.split(' ')[0]}</span><span style="color:var(--gold);">${fmt(a.score,1)}</span></div>`).join('')}
      </div>
      <div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-size:8px;color:var(--dim);letter-spacing:.12em;">
        THESIS: <span style="color:var(--gold);">${escapeHtml(d.thesis||'—')}</span> · CONF <span style="color:var(--gold);">${fmt((d.confidence||0)*100,0)}%</span>
      </div>
    `;
  }

  function renderKOL(body, data, badge){
    const d = INTEL.kol || {};
    const sent = (d.sentiment||'neutral').toLowerCase();
    badge.innerHTML = `<span class="widget-badge ${sent}">${sent.toUpperCase()}</span>`;
    body.innerHTML = `
      <div class="kol-banner ${sent}">◆ CONSENSUS · ${sent.toUpperCase()}</div>
      <div class="kol-section">${escapeHtml(d.dominant_narrative||'—')}</div>
      ${d.top_signal ? `<div class="kol-signal-box">▸ ${escapeHtml(d.top_signal)}</div>` : ''}
      ${d.contrarian_view && d.contrarian_view !== 'None detected' ? `<div class="kol-signal-box contra">⚠ ${escapeHtml(d.contrarian_view)}</div>` : ''}
      <div class="kol-voices">${d.voices_sampled||0} voices · ${(d.kol_handles_seen||[]).slice(0,4).map(h=>'@'+escapeHtml(h)).join(', ')}</div>
    `;
  }

  function renderOnChain(body, data, badge){
    const d = INTEL.on_chain || {};
    badge.innerHTML = '<span class="widget-badge live">7D</span>';
    const accu = d.accumulation_score;
    const accuColor = accu > 60 ? 'var(--green)' : accu > 40 ? 'var(--gold)' : 'var(--red)';
    body.innerHTML = `
      <div class="w-row"><span class="w-row-label">CDD 7D</span><span class="w-row-val gold">${fmtBig(d.coin_days_destroyed_7d)}</span></div>
      <div class="w-row"><span class="w-row-label">ACTIVE ADDR</span><span class="w-row-val">${fmtBig(d.active_addresses_7d)}</span></div>
      <div class="w-row"><span class="w-row-label">TX VOL USD</span><span class="w-row-val gold">$${fmtBig(d.tx_volume_usd_7d)}</span></div>
      <div class="w-row"><span class="w-row-label">NVT RATIO</span><span class="w-row-val">${fmt(d.nvt_ratio,1)}</span></div>
      <div style="margin-top:10px;">
        <div style="display:flex;justify-content:space-between;font-size:7px;color:var(--muted);letter-spacing:.15em;margin-bottom:4px;">
          <span>ACCUMULATION SCORE</span><span style="color:${accuColor};font-weight:900;">${fmt(accu,0)}/100</span>
        </div>
        <div class="w-bar"><div class="w-bar-fill" style="width:${Math.max(0,Math.min(100,Number(accu)||0))}%;background:${accuColor};"></div></div>
      </div>
    `;
  }

  function renderPolymarket(body, data, badge){
    const d = INTEL.polymarket || {};
    badge.innerHTML = '<span class="widget-badge live">POLY</span>';
    const sent = d.macro_sentiment;
    const sentClass = sent > 60 ? 'green' : sent > 40 ? 'gold' : 'red';
    body.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="w-stat">
          <span class="w-stat-label">MACRO SENTIMENT</span>
          <span class="w-stat-val ${sentClass}">${fmt(sent,0)}<span style="font-size:9px;color:var(--muted);font-weight:400;"> /100</span></span>
          <div class="w-bar" style="margin-top:4px;"><div class="w-bar-fill" style="width:${sent||0}%;background:var(--${sentClass==='green'?'green':sentClass==='red'?'red':'gold'});"></div></div>
        </div>
        <div>
          <div class="w-row-label" style="font-size:7px;margin-bottom:5px;">TOP MARKET</div>
          <div style="font-size:10px;color:var(--text);line-height:1.55;">${escapeHtml(d.top_market||'—')}</div>
          <div style="margin-top:6px;display:flex;align-items:center;justify-content:space-between;">
            <span class="w-row-label" style="font-size:7px;">PROBABILITY</span>
            <span class="w-row-val gold" style="font-size:13px;">${fmt(d.top_probability,1)}%</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderExchangeFlow(body, data, badge){
    const d = INTEL.exchange_flow || {};
    const sig = (d.signal||'neutral').toLowerCase();
    const sigClass = sig === 'bullish' ? 'bullish' : sig === 'bearish' ? 'bearish' : 'neutral';
    badge.innerHTML = `<span class="widget-badge ${sigClass}">${sig.toUpperCase()}</span>`;
    const alerts = d.whale_alerts || [];
    body.innerHTML = `
      <div class="w-row"><span class="w-row-label">FLOW SIGNAL</span><span class="w-sig-pill ${sig.toUpperCase()}">${sig.toUpperCase()}</span></div>
      <div class="brief-section-label">WHALE FEED · 24H</div>
      ${alerts.length ? alerts.map(a => {
        const msg = a.message || '';
        const btcMatch = msg.match(/([\d.]+)\s*BTC/);
        const btc = btcMatch ? btcMatch[1] : '—';
        const ts = a.created_at ? new Date(a.created_at * 1000).toISOString().replace('T',' ').slice(11,16) : '';
        return `<div class="flow-item">
          <div class="flow-icon">🐋</div>
          <div class="flow-body"><b>${btc} BTC</b> &nbsp;<span style="color:var(--muted);font-size:8px;">${escapeHtml((a.tier||'').toUpperCase())}</span></div>
          <div class="flow-time">${ts}</div>
        </div>`;
      }).join('') : '<div class="w-empty" style="padding:10px;">No recent whale activity</div>'}
    `;
  }

  function renderLanes(body, data, badge){
    badge.innerHTML = '<span class="widget-badge neutral">NAV</span>';
    const links = [
      ['/panopticon',    'fa-eye',            'Panopticon'],
      ['/terminal',      'fa-signal',         'Terminal'],
      ['/live',          'fa-satellite-dish', 'Live'],
      ['/signal-terminal','fa-chart-line',    'Signal'],
      ['/articles',      'fa-newspaper',      'Briefs'],
      ['/whale-watcher', 'fa-fish',           'Whales'],
      ['/charts',        'fa-chart-area',     'Charts'],
      ['/sentiment',     'fa-pulse',          'Sentiment'],
    ];
    if (USER_IS_ADMIN) links.push(['/admin/board', 'fa-tasks', 'Ops']);
    body.innerHTML = `<div class="lanes-grid">${links.map(([h,i,t])=>`<a href="${h}" class="lane"><i class="fas ${i}"></i>${t}</a>`).join('')}</div>`;
  }

  // ── Toast ──────────────────────────────────────────────────────────
  function toast(msg){
    const t = document.createElement('div');
    t.className = 'hub2-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  // ── Auto-refresh intel every 5 min ─────────────────────────────────
  setInterval(() => {
    fetch('/api/hub/intel', {credentials:'same-origin'}).then(r=>r.json()).then(d => {
      INTEL = d || INTEL;
      renderGrid();
      renderPCAF(INTEL.pcaf_score);
      renderNotifications(INTEL.alerts || []);
    }).catch(()=>{});
  }, 300000);

})();
</script>
{% endblock %}
