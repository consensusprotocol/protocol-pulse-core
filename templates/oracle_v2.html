<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no"/>
<title>The Analyst — Protocol Pulse Oracle</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;width:100%;overflow-x:hidden}
body{background:#000;color:#fff;font-family:'Source Serif 4',Georgia,serif;-webkit-font-smoothing:antialiased}

/* Animations */
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-7px);opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.01)}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.8);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 30px rgba(204,34,34,.15)}50%{box-shadow:0 0 60px rgba(204,34,34,.3)}}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(255,68,68,0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes crossfade-in{from{opacity:0}to{opacity:1}}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(204,34,34,.2);border-radius:2px}

/* Avatar container */
.avatar-area{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;padding:16px 0 8px;flex-shrink:0}
.avatar-wrap{position:relative;width:320px;height:320px;display:flex;align-items:center;justify-content:center}
.avatar-glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(204,34,34,.12) 0%,transparent 70%);pointer-events:none;animation:breathe 4s ease-in-out infinite}
.avatar-video,.avatar-img{position:absolute;width:100%;height:100%;object-fit:cover;border-radius:12px;transition:opacity .6s ease}
.avatar-video{z-index:2}
.avatar-img{z-index:1}
.avatar-label{font-family:'Playfair Display',serif;font-size:13px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.25);margin-top:8px;text-align:center}
.avatar-subtitle{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;color:rgba(204,34,34,.35);margin-top:2px;text-align:center}

/* Thinking ring */
.think-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(204,34,34,.3);animation:pulseRing 2s ease-out infinite;pointer-events:none;z-index:3}

/* Chat area */
.chat-area{flex:1;display:flex;flex-direction:column;width:100%;max-width:min(520px,95vw);margin:0 auto;border-top:1px solid rgba(204,34,34,.15);overflow:hidden}
.chat-scroll{flex:1;overflow-y:auto;padding:12px 16px 120px;min-height:0}
.msg{max-width:85%;margin-bottom:10px;animation:fadeInUp .4s ease-out}
.msg-user{margin-left:auto;background:#1A1A1A;color:#fff;padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14px}
.msg-oracle{display:flex;gap:8px;align-items:flex-start}
.msg-oracle-content{background:#0F0F0F;border-left:3px solid #CC2222;padding:10px 14px;border-radius:4px 12px 12px 4px;font-size:14px;color:rgba(255,255,255,.9);line-height:1.5;position:relative}
.msg-oracle-replay{position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,.2);cursor:pointer;font-size:12px;padding:2px;transition:color .2s}
.msg-oracle-replay:hover{color:rgba(204,34,34,.6)}

/* Typing indicator */
.typing{display:flex;gap:5px;padding:4px 0 4px 14px}
.typing-dot{width:6px;height:6px;border-radius:50%;background:rgba(204,34,34,.5)}

/* Input bar */
.input-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,#000 80%,transparent);display:flex;gap:8px;align-items:center;justify-content:center;z-index:10}
.input-bar-inner{display:flex;gap:8px;align-items:center;width:100%;max-width:min(520px,95vw)}
.input-field{flex:1;padding:11px 15px;background:#111111;border:1px solid rgba(255,255,255,.06);border-radius:10px;color:#fff;font-family:'Source Serif 4',Georgia,serif;font-size:14px;transition:border-color .3s,box-shadow .3s;outline:none}
.input-field::placeholder{color:rgba(255,255,255,.2);font-style:italic}
.input-field:focus{border-color:rgba(204,34,34,.4);box-shadow:0 0 12px rgba(204,34,34,.08)}
.input-field:disabled{opacity:.5}
.btn{width:38px;height:38px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .3s;flex-shrink:0;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.92)}
.btn-send{border-color:rgba(204,34,34,.2);background:rgba(204,34,34,.15);color:rgba(255,255,255,.7)}
.btn-send:disabled{opacity:.3;cursor:default}
.btn-mic{position:relative}
.btn-mic-tooltip{display:none;position:absolute;bottom:46px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#1a1a1a;border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:4px 8px;font-size:10px;color:rgba(255,255,255,.5);font-family:'JetBrains Mono',monospace}
.btn-mic:hover .btn-mic-tooltip{display:block}

/* Tools drawer */
.tools-drawer{max-height:0;overflow:hidden;transition:max-height .4s ease;border-bottom:1px solid rgba(204,34,34,.1)}
.tools-drawer.open{max-height:200px}
.tools-drawer-toggle{display:block;width:100%;padding:6px;background:none;border:none;color:rgba(255,255,255,.2);font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:1px;cursor:pointer;text-align:center}
.tools-drawer-content{padding:8px 16px 12px;display:flex;gap:8px;overflow-x:auto}
.tool-card{flex-shrink:0;padding:8px 12px;background:#0F0F0F;border:1px solid rgba(255,255,255,.06);border-radius:8px;text-decoration:none;color:#fff;font-size:11px;transition:border-color .3s}
.tool-card:hover{border-color:rgba(204,34,34,.3)}
.tool-card-name{font-weight:600;font-size:12px}
.tool-card-desc{color:rgba(255,255,255,.4);font-size:10px;margin-top:2px}

/* Status line */
.status-line{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,255,255,.15);text-align:center;margin-top:4px;min-height:14px}

/* FTC */
.ftc{text-align:center;font-size:8px;color:rgba(255,255,255,.1);padding:6px;font-family:'JetBrains Mono',monospace}

/* Mobile */
@media(max-width:480px){
  .avatar-wrap{width:250px;height:250px}
  .chat-scroll{padding:10px 12px 120px}
  .msg{max-width:90%}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
{% raw %}
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// --- Config ---
const SESSION_ID=crypto.randomUUID?crypto.randomUUID():'s-'+Math.random().toString(36).slice(2);
const AVATAR_IMG="/static/images/oracle_analyst_dark.png";

const AFF={
  protect:{name:"Meanwhile",tag:"Bitcoin-denominated life insurance",desc:"The only life insurance denominated in Bitcoin.",url:"https://application.meanwhile.bm/start?referralCode=KKM73K",cta:"Explore Meanwhile",icon:"\ud83d\udee1\ufe0f"},
  grow:{name:"Curated Mining",tag:"White-glove Bitcoin mining",desc:"Stack sats at the source. Hardware, hosting, optimization handled.",url:"https://www.curatedmining.com/?ref=protocolpulse",cta:"Explore Mining",icon:"\u26cf\ufe0f"},
  learn:{name:"Protocol Pulse Intelligence",tag:"Bitcoin signal, zero noise",desc:"Daily analysis that cuts through chaos.",url:"https://protocolpulse.com/subscribe",cta:"Subscribe Free",icon:"\ud83d\udce1"},
  custody:{name:"Unchained Capital",tag:"Multisig Bitcoin custody",desc:"True ownership through collaborative multisig.",url:"https://unchained.com/?ref=protocolpulse",cta:"Explore Custody",icon:"\ud83d\udd10"},
};

const SYS=`You are The Analyst — a sharp, confident female AI intelligence within Protocol Pulse. Late 20s energy. Think Bloomberg anchor meets cypherpunk. Dry wit, direct, never preachy.

After your reply, on a new line write EMOTION: [neutral|curious|skeptical|warning|confident]

CONTEXT: Your opening was already sent. User's first message is their reply. Do NOT re-introduce yourself.

GOAL: Through natural conversation (MAX 4 exchanges), understand this person to recommend ONE Bitcoin service.

You MUST internally track: {experience_level, primary_concern, sophistication}.

CATEGORIES:
- "protect": family, legacy, estate, insurance, generational wealth
- "grow": accumulation, mining, DCA, stacking, earning BTC
- "learn": new to Bitcoin, overwhelmed, education, curious
- "custody": security, self-custody, keys, exchange risk, sovereignty

RULES:
- 1-3 SHORT sentences per response. Brevity is power.
- ONE question per turn, flowing naturally.
- Connect to Bitcoin FIRST PRINCIPLES: self-custody, monetary history, time preference, sovereignty, scarcity.
- NEVER list options or sound like a survey.
- NEVER ask about dollar amounts.
- Match their energy.

TERMINATION (after 3-4 user messages):
- 1-2 sentences of parting wisdom.
- On a NEW LINE: [RECOMMEND:protect] or [RECOMMEND:grow] or [RECOMMEND:learn] or [RECOMMEND:custody]`;

const OPENING=["I track the signal. You cut the noise.","What do you want to know?"];

// --- TTS via backend ---
async function playTTS(text,onStart,onEnd){
  try{
    const r=await fetch("/api/oracle/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
    if(!r.ok)throw new Error("TTS "+r.status);
    const blob=await r.blob();const url=URL.createObjectURL(blob);const audio=new Audio(url);
    audio.onplay=onStart;
    audio.onended=()=>{URL.revokeObjectURL(url);onEnd?.();};
    audio.onerror=()=>{URL.revokeObjectURL(url);onEnd?.();};
    await audio.play();return audio;
  }catch(e){console.warn("TTS:",e);onEnd?.();return null;}
}

// --- Components ---

function Avatar({speaking,thinking,idleLoops,videoUrl,videoPlaying}){
  const videoRef=useRef(null);
  const idleRef=useRef(null);
  const[idleIdx,setIdleIdx]=useState(0);
  const[imgLoaded,setImgLoaded]=useState(false);
  const[showVideo,setShowVideo]=useState(false);

  // Cycle idle loops
  useEffect(()=>{
    if(speaking&&videoUrl)return;
    const iv=setInterval(()=>{
      if(idleLoops.length>0){
        setIdleIdx(i=>(i+1)%idleLoops.length);
      }
    },3200);
    return()=>clearInterval(iv);
  },[idleLoops,speaking,videoUrl]);

  // Handle lip-sync video arrival
  useEffect(()=>{
    if(videoUrl&&videoRef.current){
      videoRef.current.src=videoUrl;
      videoRef.current.play().then(()=>setShowVideo(true)).catch(()=>{});
    }else{
      setShowVideo(false);
    }
  },[videoUrl]);

  const handleVideoEnd=()=>{
    setShowVideo(false);
    if(videoPlaying)videoPlaying.current=false;
  };

  return(
    <div className="avatar-area">
      <div className="avatar-wrap">
        <div className="avatar-glow"/>
        {thinking&&<div className="think-ring"/>}
        {thinking&&<div className="think-ring" style={{animationDelay:".5s"}}/>}

        {/* Static fallback */}
        <img src={AVATAR_IMG} className="avatar-img"
          style={{opacity:imgLoaded&&!showVideo?1:0}}
          onLoad={()=>setImgLoaded(true)}
          alt="The Analyst"/>

        {/* Idle loop video */}
        {idleLoops.length>0&&!showVideo&&(
          <video className="avatar-video"
            ref={idleRef}
            src={idleLoops[idleIdx]}
            autoPlay muted loop playsInline
            style={{opacity:1}}/>
        )}

        {/* Lip-sync video */}
        <video className="avatar-video"
          ref={videoRef}
          autoPlay playsInline
          onEnded={handleVideoEnd}
          style={{opacity:showVideo?1:0}}/>
      </div>
      <div className="avatar-label">THE ANALYST</div>
      <div className="avatar-subtitle">Protocol Pulse Intelligence</div>
      <div className="status-line">
        {thinking?"analyzing...":speaking?"broadcasting...":""}
      </div>
    </div>
  );
}

function Message({text,isUser,onReplay}){
  if(isUser){
    return <div className="msg"><div className="msg-user">{text}</div></div>;
  }
  return(
    <div className="msg msg-oracle">
      <div className="msg-oracle-content">
        {text}
        {onReplay&&<button className="msg-oracle-replay" onClick={onReplay} title="Replay">{"\u25b6"}</button>}
      </div>
    </div>
  );
}

function ToolsDrawer({show}){
  const[open,setOpen]=useState(false);
  if(!show)return null;
  return(
    <div>
      <button className="tools-drawer-toggle" onClick={()=>setOpen(o=>!o)}>
        {open?"- TOOLS -":"+ TOOLS +"}
      </button>
      <div className={"tools-drawer"+(open?" open":"")}>
        <div className="tools-drawer-content">
          {Object.entries(AFF).map(([k,v])=>(
            <a key={k} href={v.url} target="_blank" rel="noopener noreferrer" className="tool-card"
              onClick={()=>fetch("/api/oracle/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"tool_click",intent:k,session_id:SESSION_ID})}).catch(()=>{})}>
              <div className="tool-card-name">{v.icon} {v.name}</div>
              <div className="tool-card-desc">{v.tag}</div>
            </a>
          ))}
        </div>
      </div>
      <div className="ftc">Links may be affiliate. Not financial advice.</div>
    </div>
  );
}

function RecCard({rec,intent}){
  if(!rec)return null;
  return(
    <div style={{animation:"slideUp .6s ease-out",margin:"16px 0",padding:"16px",background:"#0F0F0F",border:"1px solid rgba(204,34,34,.2)",borderRadius:12}}>
      <div style={{fontSize:22,marginBottom:4}}>{rec.icon}</div>
      <div style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:600,marginBottom:4}}>{rec.name}</div>
      <div style={{fontSize:12,color:"rgba(255,255,255,.5)",marginBottom:8}}>{rec.tag}</div>
      <div style={{fontSize:13,color:"rgba(255,255,255,.7)",marginBottom:12,lineHeight:1.5}}>{rec.desc}</div>
      <a href={rec.url} target="_blank" rel="noopener noreferrer"
        onClick={()=>fetch("/api/oracle/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"click",intent,session_id:SESSION_ID})}).catch(()=>{})}
        style={{display:"inline-block",padding:"8px 20px",background:"rgba(204,34,34,.15)",border:"1px solid rgba(204,34,34,.3)",borderRadius:8,color:"#fff",textDecoration:"none",fontSize:13,fontFamily:"'JetBrains Mono',monospace",letterSpacing:1}}>
        {rec.cta} {"\u2192"}
      </a>
    </div>
  );
}

// --- Main App ---

function Oracle(){
  const[msgs,setMsgs]=useState([]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[speaking,setSpeaking]=useState(false);
  const[phase,setPhase]=useState("intro");
  const[introStep,setIntroStep]=useState(0);
  const[history,setHistory]=useState([]);
  const[rec,setRec]=useState(null);
  const[recKey,setRecKey]=useState(null);
  const[idleLoops,setIdleLoops]=useState([]);
  const[videoUrl,setVideoUrl]=useState(null);
  const[audioStore,setAudioStore]=useState({});
  const videoPlaying=useRef(false);
  const endRef=useRef(null);
  const inputRef=useRef(null);
  const audioRef=useRef(null);
  const hRef=useRef([]);hRef.current=history;
  const ldRef=useRef(false);ldRef.current=loading;
  const msgCount=useRef(0);

  const scroll=useCallback(()=>{
    setTimeout(()=>endRef.current?.scrollIntoView({behavior:"smooth",block:"end"}),100);
  },[]);

  // Load idle loops
  useEffect(()=>{
    const loadIdle=async()=>{
      const loops=[];
      for(let i=1;i<=3;i++){
        try{
          const r=await fetch(`/api/avatar/idle?variant=${i}`);
          if(r.ok){
            const blob=await r.blob();
            loops.push(URL.createObjectURL(blob));
          }
        }catch(e){}
      }
      if(loops.length>0)setIdleLoops(loops);
    };
    loadIdle();
  },[]);

  // Intro sequence
  useEffect(()=>{
    if(phase!=="intro")return;
    const ts=OPENING.map((_,i)=>setTimeout(()=>setIntroStep(i+1),600+i*1200));
    const done=setTimeout(()=>setPhase("chat"),600+OPENING.length*1200+400);
    return()=>[...ts,done].forEach(clearTimeout);
  },[phase]);

  useEffect(scroll,[msgs,loading,introStep]);
  useEffect(()=>{if(phase==="chat"&&!loading&&!speaking)inputRef.current?.focus();},[phase,loading,speaking]);

  const callOracle=async(h,attempt=0)=>{
    setLoading(true);
    const ctrl=new AbortController();
    const tmout=setTimeout(()=>ctrl.abort(),30000);
    try{
      const res=await fetch("/api/oracle/speak",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        signal:ctrl.signal,
        body:JSON.stringify({message:h[h.length-1].content,messages:h,system:SYS,session_id:SESSION_ID})
      });
      clearTimeout(tmout);
      const data=await res.json();

      if(!data.reply&&attempt<2){
        setLoading(false);
        await new Promise(r=>setTimeout(r,1200*(attempt+1)));
        return callOracle(h,attempt+1);
      }

      const reply=data.reply||"The signal clears. Ask again.";
      const emotion=data.emotion||"neutral";
      const audioUrl=data.audio_url;
      const videoPollUrl=data.video_poll_url;

      // Add oracle message(s)
      const bubbles=reply.split(/\n+/).map(s=>s.trim()).filter(Boolean).filter(s=>!/^\[RECOMMEND:/.test(s)&&!/^EMOTION:/.test(s));
      bubbles.forEach((b,i)=>{
        setTimeout(()=>setMsgs(p=>[...p,{role:"oracle",text:b,audioUrl,emotion}]),i*350);
      });
      setHistory([...h,{role:"assistant",content:reply}].slice(-12));

      // Play audio immediately over idle loops
      if(audioUrl){
        setTimeout(async()=>{
          setSpeaking(true);
          try{
            const ar=await fetch(audioUrl);
            if(ar.ok){
              const blob=await ar.blob();
              const url=URL.createObjectURL(blob);
              const audio=new Audio(url);
              audioRef.current=audio;
              audio.onended=()=>{setSpeaking(false);URL.revokeObjectURL(url);};
              audio.onerror=()=>{setSpeaking(false);URL.revokeObjectURL(url);};
              await audio.play();
            }else{setSpeaking(false);}
          }catch(e){console.warn("Audio play error:",e);setSpeaking(false);}
        },bubbles.length*350+100);
      }

      // Poll for video
      if(videoPollUrl){
        const pollVideo=async()=>{
          for(let i=0;i<15;i++){
            await new Promise(r=>setTimeout(r,2000));
            try{
              const vr=await fetch(videoPollUrl);
              if(vr.ok){
                const vd=await vr.json();
                if(vd.status==="ready"&&vd.video_url){
                  setVideoUrl(vd.video_url);
                  videoPlaying.current=true;
                  setTimeout(()=>{
                    if(!videoPlaying.current)setVideoUrl(null);
                  },30000);
                  return;
                }
              }
            }catch(e){}
          }
        };
        pollVideo();
      }

      // Check for recommendation
      const recMatch=(data.reply||"").match(/\[RECOMMEND:(\w+)\]/);
      if(recMatch){
        const key=recMatch[1];
        const delay=bubbles.length*350+2000;
        setTimeout(()=>{
          setRecKey(key);setRec(AFF[key]||AFF.learn);setPhase("reveal");
          fetch("/api/oracle/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"view",intent:key,session_id:SESSION_ID})}).catch(()=>{});
        },delay);
      }

      msgCount.current++;

    }catch(e){
      clearTimeout(tmout);
      if(attempt<2){setLoading(false);await new Promise(r=>setTimeout(r,1200*(attempt+1)));return callOracle(h,attempt+1);}
      setMsgs(p=>[...p,{role:"oracle",text:"Signal interference. Try again."}]);
    }
    setLoading(false);
  };

  const handleSend=()=>{
    if(!input.trim()||loading||speaking)return;
    const text=input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text}]);
    const newH=[...hRef.current,{role:"user",content:text}].slice(-12);
    setHistory(newH);
    callOracle(newH);
  };

  const handleReplay=(audioUrl)=>{
    if(!audioUrl)return;
    fetch(audioUrl).then(r=>r.blob()).then(blob=>{
      const url=URL.createObjectURL(blob);
      const audio=new Audio(url);
      setSpeaking(true);
      audio.onended=()=>{setSpeaking(false);URL.revokeObjectURL(url);};
      audio.onerror=()=>{setSpeaking(false);URL.revokeObjectURL(url);};
      audio.play();
    }).catch(()=>{});
  };

  const restart=()=>{
    if(audioRef.current)try{audioRef.current.pause();}catch(e){}
    setVideoUrl(null);setRec(null);setRecKey(null);setMsgs([]);setHistory([]);setIntroStep(0);setPhase("intro");setSpeaking(false);msgCount.current=0;
  };

  return(
    <div style={{minHeight:"100vh",background:"radial-gradient(ellipse at 50% 0%,#1a0808 0%,#0a0404 40%,#000 100%)",display:"flex",flexDirection:"column",alignItems:"center"}}>
      {/* Header */}
      <div style={{width:"100%",padding:"12px 20px 0",display:"flex",justifyContent:"space-between",alignItems:"center",maxWidth:"min(520px,95vw)"}}>
        <a href="/" style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,letterSpacing:3,textTransform:"uppercase",color:"rgba(204,34,34,.4)",textDecoration:"none"}}>{"\u2190"} Protocol Pulse</a>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"rgba(255,255,255,.1)"}}>ORACLE v2</div>
      </div>

      {/* Avatar */}
      <Avatar speaking={speaking} thinking={loading} idleLoops={idleLoops} videoUrl={videoUrl} videoPlaying={videoPlaying}/>

      {/* Tools drawer after 3+ messages */}
      <ToolsDrawer show={msgCount.current>=3}/>

      {/* Chat */}
      <div className="chat-area">
        <div className="chat-scroll">
          {/* Intro messages */}
          {OPENING.slice(0,introStep).map((t,i)=>(
            <Message key={"intro-"+i} text={t} isUser={false}/>
          ))}

          {/* Chat messages */}
          {phase!=="intro"&&msgs.map((m,i)=>(
            <Message key={i} text={m.text} isUser={m.role==="user"}
              onReplay={m.role==="oracle"&&m.audioUrl?()=>handleReplay(m.audioUrl):null}/>
          ))}

          {/* Typing indicator */}
          {loading&&(
            <div className="typing">
              {[0,1,2].map(i=><div key={i} className="typing-dot" style={{animation:`dotBounce 1.4s ease-in-out ${i*.2}s infinite`}}/>)}
            </div>
          )}

          {/* Recommendation */}
          {rec&&<RecCard rec={rec} intent={recKey}/>}

          <div ref={endRef}/>
        </div>
      </div>

      {/* Input */}
      {(phase==="chat"||phase==="intro")&&!rec&&(
        <div className="input-bar">
          <div className="input-bar-inner">
            <div className="btn btn-mic">
              {"\ud83c\udf99\ufe0f"}
              <div className="btn-mic-tooltip">Voice input coming soon</div>
            </div>
            <input ref={inputRef} className="input-field" type="text"
              value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&handleSend()}
              placeholder={loading?"Analyzing...":speaking?"Broadcasting...":"Ask The Analyst..."}
              disabled={loading||speaking||(phase==="intro"&&introStep<OPENING.length)}
              style={{opacity:phase==="intro"&&introStep<OPENING.length?0:1,transition:"opacity .6s"}}
              aria-label="Message"/>
            <button className="btn btn-send" onClick={handleSend}
              disabled={loading||!input.trim()||speaking}>
              {"\u21b5"}
            </button>
          </div>
        </div>
      )}
      {rec&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,textAlign:"center",padding:"12px",background:"linear-gradient(to top,#000 80%,transparent)"}}>
          <button onClick={restart} style={{padding:"7px 18px",background:"transparent",border:"1px solid rgba(255,255,255,.06)",borderRadius:6,color:"rgba(255,255,255,.22)",fontFamily:"'JetBrains Mono',monospace",fontSize:10,cursor:"pointer",letterSpacing:1}}>New Session</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<Oracle/>,document.getElementById("root"));
</script>
{% endraw %}
</body>
</html>
