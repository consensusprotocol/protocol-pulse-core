<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Oracle · Protocol Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;overflow:hidden;font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}

/* ─── KEYFRAMES ─────────────────────────────────────────── */
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes orbit-rev{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes scan{0%{top:-4px}100%{top:100%}}
@keyframes live-blink{0%,100%{opacity:1}49%{opacity:1}50%,99%{opacity:.15}}
@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes mic-pulse{0%{box-shadow:0 0 0 0 rgba(255,59,95,.6)}70%{box-shadow:0 0 0 22px rgba(255,59,95,0)}100%{box-shadow:0 0 0 0 rgba(255,59,95,0)}}
@keyframes mic-idle-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,95,0)}50%{box-shadow:0 0 0 14px rgba(255,59,95,.22),0 0 18px 4px rgba(255,59,95,.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes card-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes hex-glow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,59,95,.4))}50%{filter:drop-shadow(0 0 22px rgba(255,59,95,.9))}}

/* ─── ROOT ──────────────────────────────────────────────── */
#root{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:url('/static/img/stage_bg_studio.png');
  background-size:cover;
  background-position:center center;
  background-attachment:fixed;
}

/* ─── BACKGROUND OVERLAY ────────────────────────────────── */
#root::before{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,0.6);
  pointer-events:none;
  z-index:0;
}
#root>*{position:relative;z-index:1;}
@media(max-width:768px){
  #root{background-attachment:scroll;}
}

/* ═══════════════════════════════════════════════════════════
   GATE SCREEN
═══════════════════════════════════════════════════════════ */
#gate{
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(18px,4vw,28px);
  padding:clamp(24px,5vw,48px) clamp(24px,5vw,48px);
  width:100%;max-width:520px;
  transition:opacity .35s ease;
}

/* Oracle sigil */
.sigil-wrap{
  position:relative;
  width:clamp(140px,38vw,200px);
  height:clamp(140px,38vw,200px);
  flex-shrink:0;
}
/* Rotating rings */
.ring{
  position:absolute;inset:0;
  border-radius:50%;
  border:1px solid rgba(255,59,95,.25);
}
.ring-1{animation:orbit 12s linear infinite}
.ring-1::before{
  content:'';position:absolute;
  width:6px;height:6px;background:#ff3b5f;border-radius:50%;
  top:-3px;left:50%;transform:translateX(-50%);
  box-shadow:0 0 8px #ff3b5f;
}
.ring-2{
  inset:12%;border-color:rgba(255,180,50,.2);
  animation:orbit-rev 8s linear infinite;
}
.ring-2::before{
  content:'';position:absolute;
  width:4px;height:4px;background:#f8c15c;border-radius:50%;
  bottom:-2px;left:50%;transform:translateX(-50%);
  box-shadow:0 0 6px #f8c15c;
}
/* Avatar in center */
.sigil-avatar{
  position:absolute;
  inset:18%;
  border-radius:50%;
  overflow:hidden;
  background:radial-gradient(circle,#1a0608 0%,#050203 100%);
  border:1px solid rgba(255,59,95,.3);
  animation:breathe 3.5s ease-in-out infinite;
}
.sigil-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sigil-fallback{
  width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(28px,8vw,44px);
  background:radial-gradient(circle,#2a0810 0%,#080205 100%);
}
/* Scan line */
.sigil-scan{
  position:absolute;inset:18%;border-radius:50%;overflow:hidden;pointer-events:none;
}
.sigil-scan::after{
  content:'';position:absolute;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(255,59,95,.6),transparent);
  animation:scan 2.5s ease-in-out infinite;
}

/* Wordmark */
.gate-brand{
  font-size:10px;font-weight:700;
  letter-spacing:.4em;color:rgba(255,59,95,.7);
  text-transform:uppercase;
}

/* Title */
.gate-title{
  font-size:clamp(32px,9vw,52px);
  font-weight:900;color:#fff;
  letter-spacing:-.03em;line-height:1;
  text-align:center;
}
.gate-title span{color:#ff3b5f}

/* Sub */
.gate-sub{
  font-size:clamp(13px,3.5vw,15px);
  color:#556;
  text-align:center;line-height:1.6;
  max-width:300px;
  font-weight:400;
}

/* ─── THE BUTTON ─────────────────────────────────────────── */
#gate-btn{
  position:relative;
  background:transparent;
  border:none;cursor:pointer;
  padding:0;
  width:clamp(200px,55vw,280px);
  -webkit-appearance:none;
  touch-action:manipulation;
}
#gate-btn:disabled{opacity:.4;cursor:not-allowed}
#gate-btn:active .btn-inner{transform:scale(.97)}

.btn-inner{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1a0508 0%,#0d0203 100%);
  border:1px solid rgba(255,59,95,.5);
  border-radius:4px;
  padding:clamp(14px,4vw,18px) clamp(20px,5vw,32px);
  transition:transform .1s,border-color .2s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
#gate-btn:not(:disabled):hover .btn-inner{border-color:rgba(255,59,95,.9)}

/* Top label */
.btn-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;letter-spacing:.35em;
  color:rgba(255,59,95,.6);text-transform:uppercase;
}
/* Main text */
.btn-text{
  font-size:clamp(13px,4vw,16px);font-weight:700;
  color:#fff;letter-spacing:.05em;text-transform:uppercase;
  display:flex;align-items:center;gap:10px;
}
.btn-mic-icon{
  width:16px;height:16px;flex-shrink:0;
  opacity:.9;
}
/* Corner accents */
.btn-inner::before,.btn-inner::after{
  content:'';position:absolute;width:8px;height:8px;
  border-color:rgba(255,59,95,.6);border-style:solid;
}
.btn-inner::before{top:4px;left:4px;border-width:1px 0 0 1px}
.btn-inner::after{bottom:4px;right:4px;border-width:0 1px 1px 0}
/* Glow sweep on hover */
.btn-sweep{
  position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 40%,rgba(255,59,95,.06) 50%,transparent 60%);
  transform:translateX(-100%);
  transition:transform .5s ease;
}
#gate-btn:not(:disabled):hover .btn-sweep{transform:translateX(100%)}

/* Status line below btn */
#gate-status{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:#334;letter-spacing:.08em;
  min-height:16px;text-align:center;
}
#gate-error{
  display:none;font-size:12px;color:#ff3b5f;
  text-align:center;line-height:1.5;max-width:280px;
  background:rgba(255,59,95,.06);border:1px solid rgba(255,59,95,.15);
  border-radius:4px;padding:8px 12px;
}

/* ═══════════════════════════════════════════════════════════
   LIVE STAGE
═══════════════════════════════════════════════════════════ */
#stage{
  display:none;flex-direction:column;align-items:center;
  width:100%;height:100%;
  padding:clamp(8px,2.5vw,14px) clamp(12px,3.5vw,20px) clamp(10px,3vw,16px);
  gap:clamp(6px,1.5vw,10px);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  animation:fade-up .4s ease;
}

/* Top bar */
.topbar{
  width:100%;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
}
/* Exit and minimize buttons */
.stage-controls{display:flex;align-items:center;gap:8px}
#minimize-btn,#exit-btn{
  width:28px;height:28px;border-radius:50%;
  background:transparent;border:1px solid #1e2235;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .15s,background .15s;
  -webkit-appearance:none;touch-action:manipulation;flex-shrink:0;
  opacity:0.5;
}
#minimize-btn:hover,#exit-btn:hover{opacity:1;border-color:#556;background:#0f1117}
#exit-btn:hover{border-color:rgba(255,59,95,.5)}

/* ── FLOATING MINI MODE ─────────────────────────────────────────── */
@keyframes mini-in{from{opacity:0;transform:scale(.6) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes mini-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,59,95,.4)}70%{box-shadow:0 0 0 8px rgba(255,59,95,0)}}

#oracle-float{
  position:fixed;bottom:24px;right:24px;
  width:72px;height:72px;border-radius:50%;
  background:#0a0b0f;border:2px solid rgba(255,59,95,.6);
  cursor:pointer;z-index:9999;
  display:none;align-items:center;justify-content:center;
  animation:mini-in .3s ease, mini-pulse 2s ease-in-out infinite;
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  overflow:hidden;transition:transform .15s;
}
#oracle-float:hover{transform:scale(1.08)}
#oracle-float:active{transform:scale(.95)}
#oracle-float img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#oracle-float-fallback{font-size:28px}
/* Speaking ring on float */
#oracle-float.speaking{border-color:#6cff9f;animation:mini-pulse 0.8s ease-in-out infinite}
/* Tooltip */
#oracle-float::after{
  content:"Talk to Oracle";
  position:absolute;right:80px;
  background:#0f1117;border:1px solid #1e2235;border-radius:4px;
  padding:4px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;
  color:#b8c2d9;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
#oracle-float:hover::after{opacity:1}
.topbar-brand{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:500;
  letter-spacing:.3em;color:rgba(255,59,95,.7);text-transform:uppercase;
}
.live-pill{
  display:flex;align-items:center;gap:5px;
  background:rgba(74,222,128,.06);
  border:1px solid rgba(74,222,128,.2);
  border-radius:20px;padding:3px 8px;
}
.live-dot{
  width:5px;height:5px;border-radius:50%;background:#4ade80;
  animation:live-blink 2s step-end infinite;
}
.live-text{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:500;color:#4ade80;letter-spacing:.15em;
}

/* Video */
.video-wrap{
  position:relative;
  width:100%;
  max-width:min(440px,calc(100vw - 24px));
  aspect-ratio:1/1;
  border-radius:4px;overflow:hidden;
  background:#050508;
  flex-shrink:0;
  border:2px solid rgba(220, 38, 38, 0.5);
  box-shadow:0 0 40px rgba(220, 38, 38, 0.2), inset 0 0 60px rgba(0,0,0,0.4);
}
/* Corner brackets */
.video-wrap::before,.video-wrap::after{
  content:'';position:absolute;width:16px;height:16px;
  border-color:rgba(255,59,95,.4);border-style:solid;z-index:2;
}
.video-wrap::before{top:6px;left:6px;border-width:1px 0 0 1px}
.video-wrap::after{bottom:6px;right:6px;border-width:0 1px 1px 0}

#vid{width:100%;height:100%;object-fit:cover;display:block}
.vid-ph{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 35%,#120408 0%,#050208 60%);
}
.vid-orb{
  width:50%;height:50%;border-radius:50%;
  background:radial-gradient(circle,#2a0810 0%,#080205 100%);
  border:1px solid rgba(255,59,95,.2);
  animation:breathe 3s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(24px,8vw,40px);
}

/* Subtitle */
#subtitle{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(11px,3vw,13px);color:#f8c15c;
  line-height:1.55;text-align:center;
  min-height:34px;
  opacity:0;transition:opacity .3s;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;padding:0 4px;
}
#subtitle.on{opacity:1}

/* Status */
#stat{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(10px,2.8vw,12px);
  color:#334;display:flex;align-items:center;gap:6px;
  height:18px;transition:color .2s;flex-shrink:0;
}
.spin{width:12px;height:12px;border:1.5px solid currentColor;border-top-color:transparent;border-radius:50%;display:none;animation:spin .6s linear infinite;flex-shrink:0}

/* Transcript */
#tx{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(10px,2.8vw,11px);color:#445;font-style:italic;
  min-height:16px;text-align:center;
  opacity:0;transition:opacity .2s;
  width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
}
#tx.on{opacity:1}

/* Mic */
.mic-area{display:flex;flex-direction:column;align-items:center;gap:7px;flex-shrink:0}
#mic{
  width:clamp(60px,15vw,72px);height:clamp(60px,15vw,72px);
  border-radius:50%;
  background:#0a0c12;
  border:1.5px solid #ff3b5f;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,transform .1s;
  -webkit-appearance:none;touch-action:manipulation;
  flex-shrink:0;
}
#mic:active:not(:disabled){transform:scale(.92)}
#mic:disabled{opacity:.2;cursor:not-allowed}
#mic.rec{background:#ff3b5f;animation:mic-pulse 1s ease-out infinite}
#mic.idle-pulse{border-color:#ff3b5f;border-width:2px;animation:mic-idle-pulse 1.8s ease-in-out 3}
.mic-hint{font-family:'JetBrains Mono',monospace;font-size:9px;color:#334;letter-spacing:.12em;text-transform:uppercase}
#cam-btn{
  width:42px;height:42px;border-radius:50%;background:#0a0c12;
  border:1.5px solid #334;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .15s;-webkit-appearance:none;touch-action:manipulation;
  flex-shrink:0;
}
#cam-btn:hover{border-color:#f8c15c}
#cam-btn.active{border-color:#f8c15c;background:#1a1500}
#cam-input{display:none}
#vision-status{
  font-family:'JetBrains Mono',monospace;font-size:10px;color:#f8c15c;
  text-align:center;opacity:0;transition:opacity .3s;min-height:14px;
}
#vision-status.on{opacity:1}

/* Sovereignty cards */
#cards{display:none;grid-template-columns:1fr 1fr;gap:8px;width:100%;animation:card-up .35s ease}
#cards.on{display:grid}
.card{
  background:rgba(10, 10, 10, 0.85);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255, 255, 255, 0.08);
  border-radius:8px;
  padding:clamp(10px,2.5vw,13px);
  cursor:pointer;
  transition:border-color .15s,background .15s;
  display:flex;flex-direction:column;gap:5px;
  touch-action:manipulation;
}
.card:active{background:rgba(16, 6, 16, 0.9);border-color:rgba(255,59,95,.5)}
.card-title{font-size:clamp(11px,3.2vw,13px);font-weight:600;color:#ccd;line-height:1.3}
.card-link{font-family:'JetBrains Mono',monospace;font-size:clamp(9px,2.5vw,10px);color:rgba(255,59,95,.7);text-decoration:none;letter-spacing:.03em}

/* ─── PRIVATE SESSION INDICATOR ──────────────────────────── */
.oracle-live-indicator{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.2em;
  color:#DC2626;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;
  flex-shrink:0;
}
.oracle-live-dot{
  width:6px;height:6px;border-radius:50%;
  background:#DC2626;
  box-shadow:0 0 6px #DC2626;
  animation:live-blink 2s step-end infinite;
  display:inline-block;
}

/* ═══════════════════════════════════════════════════════════
   MOBILE — max-width 640px
═══════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════
   TABLET — max-width 768px
═══════════════════════════════════════════════════════════ */
@media(max-width:768px){
  .video-wrap{
    max-width:100%;
    margin:0 auto;
  }
  #vid{
    width:100%;
    max-width:100%;
    display:block;
    margin:0 auto;
  }
  #cards{grid-template-columns:1fr 1fr}
  .card{min-height:48px}
  #mic{min-width:48px;min-height:48px}
  #cam-btn{min-width:48px;min-height:48px}
  #gate-btn{min-height:48px}
  #root{padding-bottom:80px}
}

@media(max-width:640px){
  body{position:fixed;width:100%;overflow:hidden}
  #root{position:relative;height:100dvh}
  /* Stage: full viewport, vertical stack, no overflow leak */
  #stage{
    height:100vh;height:100dvh;
    padding:8px 10px 0;
    gap:6px;
    overflow:hidden;
    display:none;flex-direction:column;
  }

  /* Topbar: compact for 375px screens */
  .topbar{
    padding:0;
    min-height:28px;
    flex-shrink:0;
  }
  .topbar-brand{font-size:9px;letter-spacing:.25em}
  .live-pill{padding:2px 6px}
  .live-text{font-size:8px}
  .stage-controls{gap:4px}
  #minimize-btn,#exit-btn{width:26px;height:26px}

  /* Video: constrain to 60vh max, centered */
  .video-wrap{
    max-height:60vh;
    max-width:calc(100vw - 20px);
    width:100%;
    aspect-ratio:1/1;
    margin:0 auto;
    flex-shrink:1;
    min-height:0;
  }
  #vid{
    width:100%;
    height:100%;
    max-width:340px;
    margin:0 auto;
    display:block;
    border-radius:8px;
    object-fit:cover;
  }

  /* Subtitle: tighter */
  #subtitle{
    font-size:11px;
    min-height:28px;
    padding:0 2px;
    flex-shrink:0;
  }

  /* Status + transcript: compact */
  #stat{font-size:10px;height:16px;flex-shrink:0}
  #tx{font-size:10px;min-height:14px;flex-shrink:0}

  /* Mic area + input controls: sticky to bottom, full width, tap-friendly */
  .mic-area{
    width:100%;
    flex-shrink:0;
    padding-bottom:env(safe-area-inset-bottom,8px);
    margin-top:auto;
  }
  #mic{
    width:60px;height:60px;
    min-width:48px;min-height:48px;
  }
  .mic-hint{font-size:9px}

  /* Camera button: 48px touch target */
  #cam-btn{
    width:48px;height:48px;
    min-width:48px;min-height:48px;
  }

  /* Vision status */
  #vision-status{font-size:9px;min-height:12px}

  /* Cards grid: 1 column on mobile */
  #cards{grid-template-columns:1fr}
  #cards.on{
    display:grid;
    max-height:30vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .card{
    padding:10px;
    min-height:48px;
    display:flex;flex-direction:row;align-items:center;
    gap:8px;
  }
  .card-title{font-size:13px}
  .card-link{font-size:10px}

  /* Gate: ensure it fits small screens */
  #gate{
    padding:20px 16px;
    gap:16px;
  }
  .sigil-wrap{width:130px;height:130px}
  .gate-title{font-size:32px}
  .gate-sub{font-size:13px;max-width:260px}
  #gate-btn{width:220px}
  .btn-inner{padding:14px 20px}
  #gate-status{font-size:10px}
  #gate-error{font-size:11px;max-width:260px}

  /* Float bubble: smaller on mobile */
  #oracle-float{
    width:56px;height:56px;
    bottom:16px;right:16px;
  }
}
</style>
</head>
<body>
<div id="root">

<!-- ══ GATE ══ -->
<div id="gate">
  <div class="gate-brand">Protocol Pulse</div>

  <div class="sigil-wrap">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="sigil-avatar">
      <img src="/static/oracle_avatar.png" alt="Oracle"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="sigil-fallback" style="display:none">⚡</div>
    </div>
    <div class="sigil-scan"></div>
  </div>

  <h1 class="gate-title">THE <span>ORACLE</span></h1>
  <p class="gate-sub">Sovereign Bitcoin intelligence.<br>Ask anything, in real time.</p>

  <button id="gate-btn" onclick="requestMic()">
    <div class="btn-sweep"></div>
    <div class="btn-inner">
      <div class="btn-label">Protocol Pulse Intelligence</div>
      <div class="btn-text">
        <svg class="btn-mic-icon" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="#ff3b5f"/>

<script>
'use strict';
/* ── iOS zoom prevention ── */

var A='https://avatar.protocolpulse.io';
var S={
  GREETING:"Hey. I'm the Oracle — tracking everything happening in Bitcoin right now. On-chain, macro, geopolitical. What brings you here?",

};

var busy=false,isRec=false,pending='',objURL=null,recognition=null;
var _greeted=false;
function pulseMic(){
  if(!mic||mic.disabled||isRec)return;
  mic.classList.remove('idle-pulse');
  void mic.offsetWidth;
  mic.classList.add('idle-pulse');
  setStat('Tap mic to respond','#ff3b5f',false);
  setTimeout(function(){mic.classList.remove('idle-pulse');setStat('Ready','#334',false);},6000);
}

// ── VISITOR FINGERPRINT ───────────────────────────────────
// Generates a stable browser fingerprint — no cookies, no login
// Used server-side to recognize returning visitors
(function() {
  try {
    var fp = '';
    // Canvas fingerprint
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillText('Oracle fp', 2, 2);
    fp += canvas.toDataURL().slice(-20);
    // Screen + timezone
    fp += screen.width + 'x' + screen.height + Intl.DateTimeFormat().resolvedOptions().timeZone;
    // Hash it (simple djb2)
    var hash = 5381;
    for (var i = 0; i < fp.length; i++) {
      hash = ((hash << 5) + hash) + fp.charCodeAt(i);
      hash = hash & hash; // 32-bit int
    }
    window._visitorToken = Math.abs(hash).toString(36);
  } catch(e) {
    window._visitorToken = 'anon';
  }
})();

// Read session_id and page context from URL params (injected by widget)
var _urlParams = new URLSearchParams(window.location.search);
var SESSION_ID = _urlParams.get('session_id') || ('sess_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));
var PAGE_CONTEXT = {
  type: _urlParams.get('page_type') || 'general',
  path: _urlParams.get('page_path') || window.location.pathname,
  content: null,
  url: document.referrer || window.location.href,
};

// Receive richer context from parent widget via postMessage
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'object') return;
  var d = e.data;
  if (d.type === 'oracle:context') {
    // Parent widget sent full page context
    if (d.sessionId) SESSION_ID = d.sessionId;
    if (d.pageContext) PAGE_CONTEXT = d.pageContext;
  }
});

// Tell parent we want context (in case we loaded before message was sent)
setTimeout(function(){
  try{ if(window.parent!==window) window.parent.postMessage({type:'oracle:context_request'},'*'); }catch(e){}
},300);

/* DOM */
var gate=document.getElementById('gate');
var stage=document.getElementById('stage');
var gBtn=document.getElementById('gate-btn');
var gStatus=document.getElementById('gate-status');
var gErr=document.getElementById('gate-error');

var vidPh=document.getElementById('vid-ph');

/* ── MIC REQUEST ── */
function requestMic(){
  gBtn.disabled=true;
  gStatus.textContent='Requesting microphone...';
  gErr.style.display='none';

  /* CRITICAL: unlock audio on this user gesture */
  try{
    var ac=new(window.AudioContext||window.webkitAudioContext)();
    var buf=ac.createBuffer(1,1,22050);
    var src=ac.createBufferSource();
    src.buffer=buf;src.connect(ac.destination);src.start(0);
    setTimeout(function(){try{ac.close();}catch(e){}},500);
  }catch(e){}

  /* Also "unlock" video element immediately */
  vid.muted=true;
  vid.play().catch(function(){});

  navigator.mediaDevices.getUserMedia({audio:true,video:false})
    .then(function(stream){
      stream.getTracks().forEach(function(t){t.stop();}); /* don't need stream, just the gesture */
      gStatus.textContent='';
      go();
    })
    .catch(function(){
      gBtn.disabled=false;
      gStatus.textContent='';
      gErr.style.display='block';
      gErr.textContent='\u26a0\ufe0f Microphone access required. Enable it in your browser and reload.';
    });
}

/* ── TRANSITION ── */
function go(){
  gate.style.opacity='0';
  setTimeout(function(){
    gate.style.display='none';
    stage.style.display='flex';
    stage.style.opacity='0';
    setTimeout(function(){
      stage.style.transition='opacity .45s';
      stage.style.opacity='1';
      initSR();
      // Reset server-side session for fresh conversation
      fetch(A+'/oracle/session/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:SESSION_ID})}).catch(function(){});
      playIntent('GREETING');
    },30);
  },350);
}

/* ── PLAY CACHED INTENT ── */
function playIntent(intent){
  setBusy(true);
  setStat('Oracle loading...','#f4c46f',true);
  // Progress messages so user knows it's working, not broken
  var _loadMsgs = ['Initializing...','Rendering response...','Almost ready...'];
  var _loadIdx = 0;
  var _loadTimer = setInterval(function(){
    _loadIdx++;
    if(_loadIdx < _loadMsgs.length) setStat(_loadMsgs[_loadIdx],'#f4c46f',true);
    else clearInterval(_loadTimer);
  }, 6000);
  var _clearTimer = function(){ clearInterval(_loadTimer); };
  showSub(S[intent]||'');
  fetchTO(A+'/oracle/speak',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({intent:intent})
  },30000)
  .then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var ct=r.headers.get('content-type')||'';
    if(ct.indexOf('video')>=0)return r.blob().then(blobURL);
    return r.json().then(function(j){
      return fetchTO(A+j.video_url,{},20000).then(function(r2){return r2.blob().then(blobURL);});
    });
  })
  .then(function(url){ if(typeof _clearTimer=='function') _clearTimer(); return playVid(url);})
  .then(function(){
    if(intent==='SOVEREIGNTY_ASSESSMENT')showCards();
    if(intent==='GREETING'){
      window._briefFetched=false;
      if(!_greeted){
        _greeted=true;
        setTimeout(function(){
          if(!busy&&!isRec&&mic&&!mic.disabled){
            startRec();
            setStat('Listening…','#6cff9f',false);
          }
        },400);
      } else { setTimeout(pulseMic,500); }
    }
  })
  .catch(function(e){
    if(e&&e.message&&e.message.indexOf('HTTP')>=0)
      setStat('Oracle error — try again.','#ff3b5f',false);
  })
  .finally(function(){
    setBusy(false);mic.disabled=false;
    setTimeout(pulseMic,500);
  });
}

function si(intent){if(busy)return;hideCards();playIntent(intent);}

/* ── PROCESS SPEECH (two-phase: audio-first + async video) ── */
function process(text){
  if(!text.trim()||busy)return;
  setBusy(true);hideCards();showTX(text);
  setStat('Oracle thinking...','#f4c46f',true);

  var pendingVideoUrl=null;

  fetchTO(A+'/oracle/chat',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:text,session_id:SESSION_ID,visitor_token:window._visitorToken||'anon',use_cache_for_intents:true,page_context:PAGE_CONTEXT,audio_first:true})
  },90000)
  .then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    var ct=r.headers.get('content-type')||'';
    if(ct.indexOf('video')>=0){
      // Cache hit — video came back immediately
      return r.blob().then(blobURL).then(function(url){ return playVid(url); });
    }
    // Audio-first JSON response
    return r.json().then(function(j){
      var responseText=j.text;
      var videoJobId=j.job_id;

      // Play audio immediately via /oracle/voice
      return fetchTO(A+'/oracle/voice',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({text:responseText})
      },10000)
      .then(function(ar){
        if(!ar.ok) throw new Error('audio failed');
        return ar.blob();
      })
      .then(function(audioBlob){
        var audioUrl=URL.createObjectURL(audioBlob);
        var audio=new Audio(audioUrl);
        audio.volume=1.0;
        setStat('Speaking','#6cff9f',false);
        vid.style.opacity='0.3';
        audio.play();

        return new Promise(function(resolve){
          audio.onended=function(){
            URL.revokeObjectURL(audioUrl);
            if(pendingVideoUrl){
              playVid(pendingVideoUrl).then(resolve);
            } else {
              setStat('Loading visual...','#f4c46f',false);
              var waitForVideo=setInterval(function(){
                if(pendingVideoUrl){
                  clearInterval(waitForVideo);
                  vid.style.opacity='1';
                  playVid(pendingVideoUrl).then(resolve);
                }
              },500);
              setTimeout(function(){
                clearInterval(waitForVideo);
                vid.style.opacity='1';
                setStat('Ready','#334',false);
                resolve();
              },30000);
            }
          };

          // Poll for video completion in parallel
          if(videoJobId){
            var pollVideo=setInterval(function(){
              fetch(A+'/oracle/job/'+videoJobId)
                .then(function(vr){ return vr.ok?vr.blob():null; })
                .then(function(vb){
                  if(vb){
                    clearInterval(pollVideo);
                    blobURL(vb);
                    pendingVideoUrl=objURL;
                    vid.style.opacity='1';
                  }
                })
                .catch(function(){});
            },1000);
            // Stop polling after 30s
            setTimeout(function(){ clearInterval(pollVideo); },30000);
          }
        });
      });
    });
  })
  .then(function(){
    setTimeout(pulseMic,500);
  })
  .catch(function(e){
    console.error('process error:',e);
    if(e&&(e.message||'').indexOf('timeout')>=0){
      setStat('Still rendering — hang tight...','#f4c46f',false);
    } else if(e&&e.message&&e.message.indexOf('HTTP')>=0){
      setStat('Oracle error — try again.','#ff3b5f',false);
    }
  })
  .finally(function(){
    setBusy(false);mic.disabled=false;hideTX();
  });
}

function blobURL(b){
  if(objURL)try{URL.revokeObjectURL(objURL);}catch(e){}
  objURL=URL.createObjectURL(b);
  return objURL;
}

/* ── PLAY VIDEO ── */
function playVid(url){
  return new Promise(function(res){
    vidPh.style.display='none';
    vid.loop=false;
    vid.src=url;
    setStat('Speaking','#6cff9f',false);
    try{if(window.parent!==window) window.parent.postMessage({type:'oracle:speaking'},'*');}catch(e){}
    vid.onended=function(){
      setStat('Ready','#334',false);hideSub();res();
      try{if(window.parent!==window) window.parent.postMessage({type:'oracle:idle'},'*');}catch(e){}
    };
    vid.onerror=function(){setStat('Video error','#ff3b5f',false);res();};
    // iOS/Brave: always start muted, unmute on canplay (within user gesture window)
    vid.muted=true;
    vid.volume=1.0;
    var unmuted=false;
    function tryUnmute(){
      if(unmuted)return; unmuted=true;
      vid.muted=false;
      vid.volume=1.0;
    }
    vid.addEventListener('canplay',function oncp(){
      vid.removeEventListener('canplay',oncp);
      tryUnmute();
    },{once:true});
    var p=vid.play();
    if(p){
      p.then(function(){
        // Playing — try to unmute
        setTimeout(tryUnmute,50);
      }).catch(function(){
        // Autoplay blocked even muted — show placeholder, let user tap to play
        setStat('Tap to play','#f4c46f',false);
        vid.addEventListener('click',function(){vid.muted=false;vid.play();},{once:true});
      });
    }
  });
}

/* ── SPEECH RECOGNITION ── */
function initSR(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){micHint.textContent='no speech api';return;}
  recognition=new SR();
  recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
  recognition.onresult=function(e){
    var fin='',int='';
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal)fin+=e.results[i][0].transcript;
      else int+=e.results[i][0].transcript;
    }
    showTX(fin||int);if(fin)pending=fin;
  };
  recognition.onend=function(){
    if(isRec){setRec(false);if(pending.trim())process(pending);pending='';}
  };
  recognition.onerror=function(e){console.warn(e.error);setRec(false);};
}

function toggleMic(){if(busy)return;isRec?stopRec():startRec();}
function startRec(){
  if(!recognition){setStat('No speech API','#ff3b5f',false);return;}
  pending='';isRec=true;setRec(true);setStat('\ud83c\udf99 Listening...','#66d9ff',false);
  try{recognition.start();}catch(e){console.warn(e);}
}
function stopRec(){isRec=false;setRec(false);if(recognition)try{recognition.stop();}catch(e){}}
function setRec(on){
  mic.classList.toggle('rec',on);
  iMic.style.display=on?'none':'block';
  iStop.style.display=on?'block':'none';
  micHint.textContent=on?'tap to send':'tap to speak';
}

/* ── HELPERS ── */
function setStat(t,c,sp){statEl.textContent=t;statEl.style.color=c||'#334';spinEl.style.display=sp?'block':'none';spinEl.style.color=c||'#334';}
function setBusy(b){busy=b;if(b){mic.disabled=true;if(isRec)stopRec();}}
function showSub(t){sub.textContent=t;sub.classList.add('on');}
function hideSub(){sub.classList.remove('on');}
function showTX(t){txEl.textContent=t;txEl.classList.add('on');}
function hideTX(){txEl.classList.remove('on');}
function showCards(){cards.classList.add('on');}
function hideCards(){cards.classList.remove('on');}
/* ── GEMINI VISION ── */
var _visionSessionId = null;

function triggerCamera(){
  document.getElementById("cam-input").click();
}

function handleVisionUpload(evt){
  var file = evt.target.files[0];
  if(!file) return;
  evt.target.value = "";
  
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.result.split(",")[1];
    var mime = file.type || "image/jpeg";
    sendVisionImage(b64, mime);
  };
  reader.readAsDataURL(file);
}

function sendVisionImage(b64, mimeType){
  setBusy(true);
  showVisionStatus("Analyzing your screen...");

  var endpoint = _visionSessionId ? A+"/vision/guide" : A+"/vision/analyze";
  var body = {image_base64:b64, mime_type:mimeType,
    context:"User needs Bitcoin hardware setup guidance"};
  if(_visionSessionId){
    body.session_id = _visionSessionId;
    body.question = "What step am I at and what should I do next?";
  }

  fetchTO(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)},20000)
  .then(function(r){
    if(!r.ok) throw new Error("vision "+r.status);
    return r.json();
  })
  .then(function(d){
    _visionSessionId = d.session_id || _visionSessionId;
    // FIXED: use guidance_text key (actual API response field)
    var raw = d.guidance_text || d.guidance || d.analysis || d.response
      || "I can see your hardware. Let me walk you through the next step.";
    // Security alert takes priority
    if(d.security_alert) raw = d.security_alert + ". " + raw;
    // Hard 30-word cap for TTS speed
    var words = raw.split(/\s+/);
    var guideText = words.length > 30 ? words.slice(0,30).join(" ") : raw;

    showVisionStatus("Speaking...");
    showSub(guideText);

    // VOICE-ONLY: /oracle/voice is ElevenLabs-only, no GPU, ~400ms vs 14s
    return fetchTO(A+"/oracle/voice",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:guideText})},15000)
    .then(function(ar){
      if(!ar.ok) throw new Error("voice "+ar.status);
      return ar.blob();
    })
    .then(function(audioBlob){
      hideVisionStatus();
      // Play audio over the still avatar (no lip sync — but instant)
      var audioURL = URL.createObjectURL(audioBlob);
      var audio = new Audio(audioURL);
      audio.volume = 1.0;
      setStat("Speaking","#6cff9f",false);
      return new Promise(function(res){
        audio.onended = function(){
          URL.revokeObjectURL(audioURL);
          setStat("Ready","#334",false);
          hideSub();
          res();
        };
        audio.onerror = function(){ URL.revokeObjectURL(audioURL); res(); };
        audio.play().catch(function(){ res(); });
      });
    });
  })
  .catch(function(e){
    console.error("Vision error:", e);
    showVisionStatus("Vision error — try again.");
    setTimeout(hideVisionStatus, 3000);
  })
  .finally(function(){ setBusy(false); mic.disabled=false; });
}

function showVisionStatus(msg){ 
  var el=document.getElementById("vision-status");
  el.textContent=msg; el.classList.add("on");
}
function hideVisionStatus(){ 
  var el=document.getElementById("vision-status");
  el.classList.remove("on");
}

/* ── MINIMIZE / EXIT / FLOAT ── */
var _oracleMinimized = false;

function minimizeOracle(){
  var inIframe = (function(){ try{ return window.self !== window.top; }catch(e){ return true; }})();
  if(inIframe){
    try{ window.parent.postMessage({type:'oracle:minimize'},'*'); }catch(e){}
    return;
  }
  // Standalone: shrink to float bubble
  _oracleMinimized = true;
  document.getElementById("oracle-root").style.display = "none";
  var f = document.getElementById("oracle-float");
  if(f){ f.style.display = "flex"; if(busy) f.classList.add("speaking"); }
}

function restoreOracle(){
  _oracleMinimized = false;
  document.getElementById("oracle-float").style.display = "none";
  document.getElementById("oracle-root").style.display = "flex";
  document.getElementById("oracle-float").classList.remove("speaking");
}

function exitOracle(){
  // If running inside widget iframe — tell parent to close
  var inIframe = (function(){ try{ return window.self !== window.top; }catch(e){ return true; }})();
  if(inIframe){
    try{ window.parent.postMessage({type:'oracle:close'},'*'); }catch(e){}
    return;
  }
  // Standalone page — return to gate screen
  _oracleMinimized = false;
  // Stop any playing audio/video
  vid.pause(); vid.src="";
  if(isRec) stopRec();
  // Reset session on server
  fetch(A+"/oracle/session/reset",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({session_id:SESSION_ID})}).catch(function(){});
  // Hide everything
  document.getElementById("oracle-float").style.display = "none";
  document.getElementById("live-stage").style.display = "none";
  document.getElementById("oracle-root").style.display = "flex";
  // Show gate again
  var g = document.getElementById("gate");
  g.style.display = "flex";
  g.style.opacity = "1";
  g.style.transition = "opacity .3s";
  // Reset state
  busy = false; window._briefFetched = false;
  setStat("Ready","#334",false);
  hideSub(); hideTranscript && hideTX();
}

// Keep float speaking indicator in sync
var _origSetStat = setStat;
setStat = function(msg, color, spin){
  _origSetStat(msg, color, spin);
  var f = document.getElementById("oracle-float");
  if(f && _oracleMinimized){
    if(msg === "Speaking") f.classList.add("speaking");
    else f.classList.remove("speaking");
  }
};

function fetchTO(url,opts,ms){
  var ctrl=new AbortController();
  var id=setTimeout(function(){ctrl.abort();},ms);
  var o=opts||{};o.signal=ctrl.signal;
  return fetch(url,o).finally(function(){clearTimeout(id);})
    .catch(function(e){if(e.name==='AbortError')throw new Error('timeout');throw e;});
}
</script>
