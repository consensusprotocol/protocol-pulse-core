<!-- Oracle Floating Widget — add before </body> in base.html -->
<div id="oracle-widget" style="display:none">
  <div id="ow-bubble" onclick="toggleOracleWidget()">
    <img src="/static/images/oracle_avatar_anime.png" alt="Oracle" id="ow-avatar">
    <div id="ow-glow"></div>
  </div>
  <div id="ow-chat" class="ow-hidden">
    <div id="ow-header">
      <span>THE <b style="color:#dc2626">ORACLE</b></span>
      <div>
        <a href="/oracle" id="ow-expand" title="Full page">&#x26F6;</a>
        <button onclick="toggleOracleWidget()" id="ow-close">&times;</button>
      </div>
    </div>
    <div id="ow-messages">
      <div class="ow-msg ow-msg-oracle">Ask me about Bitcoin.</div>
    </div>
    <div id="ow-typing" class="ow-typing-hidden"><span></span><span></span><span></span></div>
    <div id="ow-input-area">
      <input type="text" id="ow-input" placeholder="Ask The Oracle..." maxlength="500">
      <button id="ow-send" onclick="owSend()">&#x27A4;</button>
    </div>
  </div>
</div>
<style>
#oracle-widget{position:fixed;bottom:20px;right:20px;z-index:99999;font-family:'JetBrains Mono',monospace}
#ow-bubble{width:52px;height:52px;border-radius:50%;cursor:pointer;position:relative;transition:transform .2s}
#ow-bubble:hover{transform:scale(1.08)}
#ow-avatar{width:52px;height:52px;border-radius:50%;border:2px solid #991b1b;display:block}
#ow-glow{position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(220,38,38,0.4);animation:ow-pulse 3s ease-in-out infinite;pointer-events:none}
@keyframes ow-pulse{0%,100%{opacity:0.4;transform:scale(1)}50%{opacity:0.8;transform:scale(1.08)}}
#ow-chat{position:absolute;bottom:64px;right:0;width:340px;max-height:480px;background:#111;border:1px solid #1a1a1a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6)}
#ow-chat.ow-hidden{display:none}
#ow-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #1a1a1a;font-size:12px;color:#e5e5e5;letter-spacing:1px}
#ow-header div{display:flex;align-items:center;gap:8px}
#ow-expand{color:#888;text-decoration:none;font-size:14px;transition:color .2s}
#ow-expand:hover{color:#dc2626}
#ow-close{background:none;border:none;color:#888;font-size:18px;cursor:pointer;padding:0;line-height:1}
#ow-close:hover{color:#dc2626}
#ow-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:320px;scrollbar-width:thin;scrollbar-color:#991b1b transparent}
.ow-msg{max-width:85%;padding:8px 12px;border-radius:10px;font-size:12px;line-height:1.5;animation:ow-in .2s ease}
@keyframes ow-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ow-msg-user{align-self:flex-end;background:#991b1b;color:#fff;border-bottom-right-radius:3px}
.ow-msg-oracle{align-self:flex-start;background:rgba(20,20,20,0.9);border:1px solid #1a1a1a;color:#e5e5e5;border-bottom-left-radius:3px}
#ow-typing{display:flex;gap:3px;padding:8px 12px;align-self:flex-start}
#ow-typing.ow-typing-hidden{display:none}
#ow-typing span{width:5px;height:5px;border-radius:50%;background:#dc2626;animation:ow-dot 1.4s infinite}
#ow-typing span:nth-child(2){animation-delay:.2s}
#ow-typing span:nth-child(3){animation-delay:.4s}
@keyframes ow-dot{0%,60%,100%{opacity:.3;transform:scale(.8)}30%{opacity:1;transform:scale(1)}}
#ow-input-area{display:flex;gap:6px;padding:10px;border-top:1px solid #1a1a1a}
#ow-input{flex:1;background:#0a0a0a;border:1px solid #1a1a1a;color:#fff;padding:8px 10px;border-radius:6px;font-family:inherit;font-size:12px;outline:none}
#ow-input:focus{border-color:#dc2626}
#ow-send{background:#dc2626;color:#fff;border:none;width:34px;height:34px;border-radius:6px;cursor:pointer;font-size:14px;transition:background .2s}
#ow-send:hover{background:#ef4444}
@media(max-width:600px){#ow-chat{width:calc(100vw - 24px);right:-8px;max-height:70vh;bottom:60px}#ow-bubble{width:44px;height:44px}#ow-avatar{width:44px;height:44px}}
</style>
<script>
(function(){
if(window.location.pathname==='/oracle'){return}
document.getElementById('oracle-widget').style.display='block';
let owOpen=false,owProcessing=false,owHistory=[];
const owAudioCtx=new(window.AudioContext||window.webkitAudioContext)();

window.toggleOracleWidget=function(){
  owOpen=!owOpen;
  document.getElementById('ow-chat').classList.toggle('ow-hidden',!owOpen);
  if(owOpen)document.getElementById('ow-input').focus();
};

window.owSend=async function(){
  if(owProcessing)return;
  const inp=document.getElementById('ow-input');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';owProcessing=true;
  const msgs=document.getElementById('ow-messages');
  const ud=document.createElement('div');ud.className='ow-msg ow-msg-user';ud.textContent=msg;msgs.appendChild(ud);
  owHistory.push({role:'user',content:msg});
  document.getElementById('ow-typing').classList.remove('ow-typing-hidden');
  msgs.scrollTop=msgs.scrollHeight;
  try{
    const r=await fetch('/api/oracle/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,history:owHistory.slice(-6)})});
    const d=await r.json();
    document.getElementById('ow-typing').classList.add('ow-typing-hidden');
    if(d.error){const e=document.createElement('div');e.className='ow-msg ow-msg-oracle';e.textContent=d.error;msgs.appendChild(e);}
    else{
      const od=document.createElement('div');od.className='ow-msg ow-msg-oracle';od.textContent=d.response;msgs.appendChild(od);
      owHistory.push({role:'assistant',content:d.response});
      if(d.audio){
        try{
          if(owAudioCtx.state==='suspended')await owAudioCtx.resume();
          const raw=atob(d.audio),buf=new ArrayBuffer(raw.length),v=new Uint8Array(buf);
          for(let i=0;i<raw.length;i++)v[i]=raw.charCodeAt(i);
          const ab=await owAudioCtx.decodeAudioData(buf.slice(0));
          const src=owAudioCtx.createBufferSource();src.buffer=ab;src.connect(owAudioCtx.destination);src.start(0);
        }catch(ae){console.warn('Widget audio error:',ae)}
      }
    }
  }catch(e){
    document.getElementById('ow-typing').classList.add('ow-typing-hidden');
    const ed=document.createElement('div');ed.className='ow-msg ow-msg-oracle';ed.textContent='Signal disrupted.';msgs.appendChild(ed);
  }finally{owProcessing=false;msgs.scrollTop=msgs.scrollHeight}
};

document.getElementById('ow-input').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();owSend()}});
})();
</script>
