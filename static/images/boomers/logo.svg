<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="The Bitcoin Boomers">
  <defs>
    <linearGradient id="bbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="55%" stop-color="#D4860A"/>
      <stop offset="100%" stop-color="#A36505"/>
    </linearGradient>
    <linearGradient id="bbDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A130A"/>
      <stop offset="100%" stop-color="#0A0804"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" rx="12" ry="12" fill="url(#bbDark)"/>
  <rect x="6" y="6" width="188" height="188" rx="8" ry="8" fill="none" stroke="url(#bbGold)" stroke-width="1.2" opacity="0.55"/>
  <circle cx="100" cy="100" r="76" fill="none" stroke="url(#bbGold)" stroke-width="1" opacity="0.4"/>
  <text x="100" y="122"
        font-family="'Playfair Display', Georgia, serif"
        font-weight="900"
        font-size="96"
        fill="url(#bbGold)"
        text-anchor="middle"
        letter-spacing="-4">BB</text>
  <text x="100" y="155"
        font-family="'JetBrains Mono', monospace"
        font-size="9"
        fill="#F5E6C8"
        text-anchor="middle"
        letter-spacing="3"
        opacity="0.72">THE BITCOIN BOOMERS</text>
  <line x1="60" y1="168" x2="140" y2="168" stroke="url(#bbGold)" stroke-width="1" opacity="0.5"/>
</svg>
